  --panel: #0d191f;
  --line: #263b40;
  --text: #f2f7ee;
  --muted: #9aacad;
  --lime: #dfff80;
  --cyan: #83dfec;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-synthesis: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 50% 27%, #14242a 0%, transparent 58%),
    repeating-linear-gradient(90deg, transparent 0 59px, #9cdbea09 60px 61px),
    var(--page);
  color: var(--text);
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
button, canvas { -webkit-tap-highlight-color: transparent; }
.game { max-width: 526px; margin: 0 auto; padding: 21px 16px max(14px, env(safe-area-inset-bottom)); }
.masthead, .brand, .header-right, .meter-top, .section-head, .equipment-info, .equipment-actions, .controls { display: flex; align-items: center; }
.masthead { justify-content: space-between; margin-bottom: 15px; }
.brand { gap: 12px; }
h1, h2, p { margin: 0; }
h1 { font-size: 26px; letter-spacing: .09em; line-height: 1.18; font-weight: 850; }
.brand p { color: var(--muted); font-size: 11px; letter-spacing: .19em; margin-top: 3px; }
.insignia { position: relative; display: grid; place-items: center; width: 41px; height: 41px; }
.insignia::before { content: ""; position: absolute; width: 30px; height: 18px; border: 1px solid var(--lime); border-radius: 100%; transform: rotate(-42deg); }
.insignia::after { content: ""; width: 11px; height: 11px; background: var(--lime); transform: rotate(45deg); box-shadow: 0 0 16px #dfff8080; }
.header-right { gap: 12px; }
.record { display: grid; gap: 3px; justify-items: end; color: var(--muted); font-size: 10px; letter-spacing: .07em; }
.record strong { color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.quiet { border: 1px solid var(--line); color: var(--text); background: #142229; border-radius: 6px; }
.quiet:enabled:hover { background: #1a3036; border-color: #557373; }
.icon-button { width: 37px; height: 37px; display: grid; place-items: center; }
.speaker { position: relative; width: 17px; height: 17px; }
.speaker::before { content: ""; position: absolute; left: 0; top: 3px; width: 10px; height: 11px; background: #c2d5d7; clip-path: polygon(0 32%, 31% 32%, 100% 0, 100% 100%, 31% 68%, 0 68%); }
.speaker::after { content: ""; position: absolute; left: 9px; top: 3px; width: 5px; height: 11px; border-right: 2px solid #c2d5d7; border-radius: 50%; }
[aria-pressed="false"] .speaker::after { left: 11px; top: 7px; width: 7px; height: 0; border: 1px solid #c2d5d7; border-radius: 0; transform: rotate(-45deg); }
.arena-shell { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px #0006; }
.telemetry { min-height: 60px; background: #111e24; display: grid; grid-template-columns: 1.2fr 1fr 34px; gap: 16px; padding: 11px 13px; align-items: center; }
.meter-top { justify-content: space-between; gap: 4px; font-size: 11px; color: #bfd0ce; white-space: nowrap; margin-bottom: 6px; }
.meter-top strong { font-family: var(--mono); font-size: 12px; color: var(--text); }
.meter-top small { color: var(--muted); font-size: 10px; }
.meter-top i, .arena-status i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #85ebbf; box-shadow: 0 0 8px #85ebbf70; }
.meter { height: 5px; border-radius: 8px; background: #26353a; overflow: hidden; }

.slot.candidate { border-style: dashed; border-color: var(--gear-color); }
.slot:disabled { border-style: dashed; }
.slot .empty { font-family: var(--mono); font-size: 18px; opacity: .6; line-height: 1; }
.slot .tier { position: absolute; font: 700 10px var(--mono); right: 5px; bottom: 4px; color: #e8f3ef; }
.glyph { width: 24px; height: 24px; display: block; background: currentColor; filter: drop-shadow(0 0 6px currentColor); }
.pulse { clip-path: polygon(93% 7%, 71% 70%, 48% 53%, 10% 90%, 4% 80%, 43% 45%, 30% 25%); }

.well { background: repeating-radial-gradient(circle, currentColor 0 2px, transparent 3px 5px); border-radius: 50%; }

.disruptor { clip-path: polygon(4% 21%, 42% 21%, 57% 39%, 51% 46%, 35% 35%, 18% 35%, 18% 49%, 4% 49%, 4% 21%, 96% 79%, 58% 79%, 43% 61%, 50% 54%, 65% 65%, 82% 65%, 82% 51%, 96% 51%); }
.mine { clip-path: polygon(50% 0%, 60% 24%, 85% 15%, 76% 41%, 100% 50%, 76% 59%, 85% 85%, 60% 76%, 50% 100%, 40% 76%, 15% 85%, 24% 59%, 0 50%, 24% 41%, 15% 15%, 40% 24%); }
.recycler { clip-path: polygon(50% 0, 88% 18%, 100% 58%, 75% 46%, 69% 33%, 50% 23%, 31% 33%, 25% 46%, 0 58%, 12% 18%, 50% 0, 50% 47%, 70% 70%, 56% 96%, 44% 96%, 30% 70%, 50% 47%); }
.capacitor { clip-path: polygon(35% 3%, 65% 3%, 65% 14%, 82% 14%, 82% 97%, 18% 97%, 18% 14%, 35% 14%, 35% 3%, 36% 41%, 36% 68%, 64% 68%, 64% 41%, 36% 41%); }
.aftershock { clip-path: polygon(49% 0%, 61% 31%, 91% 14%, 75% 44%, 100% 65%, 66% 66%, 58% 100%, 42% 73%, 13% 91%, 24% 55%, 0 37%, 34% 33%); }
.coil { background: repeating-radial-gradient(ellipse, currentColor 0 2px, transparent 3px 5px); border-radius: 50%; }
.spike { clip-path: polygon(96% 6%, 69% 78%, 52% 63%, 27% 95%, 14% 82%, 37% 53%, 17% 43%); }
.dynamo { clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%, 50% 0%, 37% 28%, 54% 28%, 48% 47%, 68% 47%, 43% 76%, 47% 55%, 30% 55%, 37% 28%); }
.equipment-info { margin-top: 8px; min-height: 28px; justify-content: space-between; gap: 8px; }
.equipment-copy { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; line-height: 1.3; }

.equipment-actions { gap: 5px; flex-shrink: 0; }
.compact { min-height: 32px; padding: 4px 9px; font-size: 11px; }
.compact:disabled { color: #839195; background: #111b20; }
.fusion:enabled { color: var(--lime); border-color: #697d49; }
.controls { margin-top: 11px; gap: 8px; }
.controls button { flex: 1; }
.primary, .secondary { min-height: 46px; border-radius: 7px; font-size: 15px; font-weight: 800; letter-spacing: .045em; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 10px; }
.primary { border: 1px solid #ebfba5; color: #182009; background: var(--lime); box-shadow: inset 0 -3px 0 #b3d166; }
.primary:enabled:hover { background: #eeffae; }
.primary:enabled:active, .secondary:enabled:active { transform: translateY(1px); }
.primary:disabled { background: #232e26; border-color: #3d4d36; color: #b2c0a5; box-shadow: none; }
.secondary { border: 1px solid #496263; background: #15268a10; color: #e6f5ed; }
.secondary:enabled:hover { background: #213437; }
.secondary:disabled { opacity: .55; }
.cost { display: flex; align-items: center; gap: 3px; font: 700 13px var(--mono); padding: 4px 5px; border-radius: 4px; background: #27391d25; }
.switch-mark { color: var(--cyan); font: 700 19px var(--mono); }

.hint { margin-top: 8px; min-height: 19px; color: #aabebb; text-align: center; font-size: 11px; line-height: 1.5; }
.overlay { position: absolute; inset: 0; display: grid; align-items: center; justify-items: center; background: #071119bd; padding: 18px; z-index: 2; }

.result-label { color: var(--lime); font-size: 11px; letter-spacing: .14em; }
.result h2 { margin-top: 6px; font-size: 24px; }

@media (max-width: 400px) {
  .game { padding-left: 11px; padding-right: 11px; }

}
@media (max-width: 345px) {
  .game { padding-left: 8px; padding-right: 8px; }
  .loadout { padding-left: 8px; padding-right: 8px; }
  .slots { gap: 4px; }
  kbd { display: none; }
}
@media (pointer: coarse) { kbd { display: none; } }
@media (min-width: 650px) and (min-height: 900px) { .game { padding-top: 35px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
}

[data-stage="11"] .stage-art span { border-radius: 8px; transform: rotate(-17deg); }
[data-stage="12"] .stage-art b { border-style: double; height: 33px; transform: rotate(30deg); }
[data-stage="13"] .stage-art span { border-radius: 32% 50% 21% 40%; transform: rotate(24deg); }
[data-stage="14"] .stage-art b { border-style: dashed; transform: rotate(-55deg); height: 29px; }
[data-stage="15"] .stage-art span { width: 35px; height: 43px; border-radius: 12% 31% 19% 27%; transform: rotate(42deg); }
[data-stage="16"] .stage-art span { background: radial-gradient(circle at 36% 34%, #fff4d5 0 4%, #f6816e 33%, #793944 62%, #1c2433 78%); }
[data-stage="16"] .stage-art b { border-width: 2px; transform: rotate(-23deg); height: 26px; }
.stage-card.locked .stage-art { filter: saturate(.45); }
.stage-copy { padding: 9px 11px 8px; }
.stage-meta, .stage-footer { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
.stage-index { font: 700 11px var(--mono); color: var(--stage-color); }
.stage-state { color: #aebfb9; font-size: 10px; }
.stage-card.cleared .stage-state { color: #bce59d; }
.stage-card h3 { margin: 3px 0; font-size: 17px; }
.stage-card p { color: #b3c3c1; font-size: 11px; line-height: 1.45; }
.stage-reward {
  display: block; min-height: 29px; padding: 3px 6px; border: 1px solid #3b5152; border-radius: 5px;
  color: var(--stage-color); background: #14252b; font-size: 11px; margin-top: 6px; text-align: left;
}
.stage-footer { margin-top: 6px; }
.stage-score { color: var(--muted); font-size: 10px; }
.stage-launch {
  min-height: 40px; min-width: 78px; border: 1px solid #819956; background: #273a2c; border-radius: 5px;
  color: var(--lime); font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.stage-launch:enabled:hover { background: #43572f; }
.stage-launch:disabled { color: #97aaa9; border-color: var(--line); background: #131f23; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.equipment-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(81px, auto); gap: 7px; }
.equipment-tools select { font-size: 13px; }
.equipment-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.equipment-tile {
  display: flex; align-items: center; min-width: 0; gap: 7px; min-height: 48px; padding: 5px 7px;
  text-align: left; color: var(--gear-color, var(--cyan)); background: #142229;
  border: 1px solid #36575a; border-radius: 6px;
}
.equipment-tile > .glyph { flex: 0 0 18px; height: 18px; }
.equipment-tile-copy { min-width: 0; display: grid; gap: 2px; }
.equipment-tile-copy strong { color: var(--text); font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
.equipment-tile-copy span { color: #b7c8c4; font-size: 10px; line-height: 1.2; }
.equipment-tile.locked { background: #101b21; border-style: dashed; }
.equipment-tile.locked .glyph { opacity: .65; }
.equipment-tile[aria-pressed="true"] { border: 1px solid var(--gear-color, var(--cyan)); background: #243933; }
.equipment-tile:hover { border-color: var(--gear-color, var(--cyan)); }
.catalog-empty { padding: 14px 5px; text-align: center; font-size: 12px; color: var(--muted); }
.catalog-pager .pager-arrow { min-height: 36px; }
.catalog-detail { padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.catalog-heading { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.catalog-heading h3 { margin: 0; color: var(--text); font-size: 16px; }
.catalog-heading p { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.catalog-icon {
  display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid #486668;
  border-radius: 7px; background: #13282c; color: var(--gear-color, var(--cyan));
}
.catalog-icon .glyph { width: 23px; height: 23px; }
.catalog-state { color: #a8b9b7; font-size: 11px; white-space: nowrap; }
.catalog-state.owned { color: var(--lime); }
.catalog-tiers { display: grid; gap: 5px; margin: 10px 0 0; }
.catalog-tiers div { display: grid; grid-template-columns: 24px 1fr; align-items: baseline; gap: 6px; font-size: 12px; line-height: 1.35; }
.catalog-tiers dt { color: var(--gear-color, var(--cyan)); font: 700 11px var(--mono); }
.catalog-tiers dd { margin: 0; color: #cfdfda; }
.catalog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
.catalog-actions button { min-height: 39px; font-size: 12px; padding: 4px 7px; margin-top: 8px; }
.catalog-support-note { color: var(--muted); font-size: 12px; line-height: 1.45; padding: 0 2px; }
.pilot-card { display: flex; align-items: center; gap: 12px; }
.pilot-avatar { display: grid; align-items: center; justify-items: center; flex: 0 0 55px; aspect-ratio: 1; border-radius: 10px; background: #263d34; border: 1px solid #567b62; }
.pilot-form { min-width: 0; flex: 1; }
.pilot-form label { color: var(--muted); font-size: 11px; }
.pilot-form div { display: flex; gap: 6px; margin-top: 4px; }
.pilot-form input { min-width: 0; flex: 1; color: var(--text); background: #142229; border: 1px solid #415b5a; border-radius: 5px; padding: 6px 8px; font: inherit; font-size: 14px; }
.pilot-form input:focus-visible { outline: 2px solid var(--cyan); }
.pilot-form span { display: block; font-size: 11px; color: var(--lime); }
.pilot-form span:not(:empty) { margin-top: 5px; }
.pilot-record { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; margin: 0; }
.pilot-record > div { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px 8px; text-align: center; }
.pilot-record dt { color: var(--muted); font-size: 11px; }
.pilot-record dd { color: var(--lime); font: 700 16px var(--mono); margin: 5px 0 0; }
.audio-settings h3 { margin-bottom: 6px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 9px; font-size: 13px; color: #d6e8e4; }
.setting-row + .setting-row { margin-top: 9px; border-top: 1px solid var(--line); }
.toggle { min-width: 54px; min-height: 33px; border-radius: 17px; border: 1px solid var(--line); background: #142229; color: #bcd1ce; padding: 4px 9px; font-size: 12px; }
.toggle[aria-checked="true"] { background: #2b462f; color: var(--lime); border-color: #72944e; }
.result-actions { display: flex; gap: 6px; margin-top: 7px; }
.result-actions button { flex: 1; }
#battle-screen[data-stage]:not([data-stage="1"]) .arena::before {
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--stage-color) 16%, transparent), #070f19a0);
}
@media (max-width: 385px) {
  .stage-card { grid-template-columns: 75px minmax(0,1fr); }
  .hero-content { padding: 18px; }
  .hero-ship { width: 34px; height: 21px; }
}
@media (max-width: 355px) {
  .main-nav .nav-icon { display: none; }
  .result { padding: 12px; }
  .result h2 { font-size: 20px; }
}

:where(.page-heading h2, .hero-content h2, #battle-screen):focus { outline: none; }
.orbit-label.charged { color: #ffd3ce; border-color: #a56d73; }
.arena-status.interference { color: #bcf7f1; border-color: #60938f; }
.arena-status.interference i { background: #8cebe1; box-shadow: 0 0 8px #8cebe188; }

</style>
</head>
<body>
<main class="game">
  <header class="masthead">
    <div class="brand">
      <span class="insignia" aria-hidden="true"></span>
      <div><h1>碎星轨道</h1><p id="header-caption">轨道合成塔防</p></div>
    </div>
    <div class="header-right">
      <div class="record" id="battle-record" hidden><span>本关最佳</span><strong id="record">—</strong></div>
      <button class="quiet icon-button" id="sound" aria-label="关闭背景音乐" title="背景音乐" aria-pressed="true"><span class="speaker"></span></button>
    </div>
  </header>

  <nav class="main-nav" id="main-nav" aria-label="游戏导航">
    <button type="button" data-screen="home" aria-current="page"><span class="nav-icon nav-home" aria-hidden="true"></span>主界面</button>
    <button type="button" data-screen="levels"><span class="nav-icon nav-levels" aria-hidden="true"></span>关卡</button>
    <button type="button" data-screen="equipment"><span class="nav-icon nav-equipment" aria-hidden="true"></span>装备</button>
    <button type="button" data-screen="profile"><span class="nav-icon nav-profile" aria-hidden="true"></span>玩家档案</button>
  </nav>

  <section id="home-screen" class="menu-screen" aria-labelledby="home-heading">
    <div class="home-hero">
      <div class="hero-sky" aria-hidden="true">
        <span class="hero-orbit orbit-one"></span><span class="hero-orbit orbit-two"></span>
        <span class="hero-planet"></span><span class="hero-ship"></span><span class="hero-satellite"></span>
      </div>
      <div class="hero-content">
        <h2 id="home-heading" tabindex="-1">星核防线</h2>
        <p>守住星核，保卫碎星带。</p>
        <button class="primary hero-action" id="home-play">开始出击 <span aria-hidden="true">→</span></button>
      </div>
    </div>
    <div class="mission-summary">
      <div class="mission-heading"><h3>关卡进度</h3><strong id="home-progress">0 / 16</strong></div>
      <div class="mission-progress" role="progressbar" id="home-meter" aria-label="通关进度" aria-valuemin="0" aria-valuemax="16" aria-valuenow="0"><span id="home-fill"></span></div>
      <p id="home-current">下一目标 · 残骸边境</p>
    </div>
  </section>

  <section id="levels-screen" class="menu-screen" aria-labelledby="levels-heading" hidden>
    <div class="page-heading browse-heading">
      <h2 id="levels-heading" tabindex="-1">关卡选择</h2>
      <button type="button" id="level-resume" class="quiet">继续进度</button>
    </div>
    <form class="level-jump" id="level-jump">
      <label for="level-number">关卡直达</label>
      <input id="level-number" type="text" inputmode="numeric" autocomplete="off" aria-describedby="level-jump-error">
      <button class="quiet" type="submit">前往</button>
      <p id="level-jump-error" role="status" hidden></p>
    </form>
    <div class="level-book">
      <div class="browse-pager">
        <button id="chapter-prev" class="quiet pager-arrow" type="button" aria-label="上一章">‹</button>
        <div aria-live="polite">
          <h3 id="chapter-name">星核防线</h3>
          <p id="chapter-range">第 01–08 关</p>
        </div>
        <button id="chapter-next" class="quiet pager-arrow" type="button" aria-label="下一章">›</button>
      </div>
      <div id="stage-grid" class="stage-grid" role="group" aria-label="本章关卡"></div>
    </div>
    <article class="stage-card" id="stage-detail" tabindex="-1" aria-labelledby="stage-name">
      <div class="stage-art" aria-hidden="true"><span></span><b></b></div>
      <div class="stage-copy">
        <div class="stage-meta"><span class="stage-index" id="stage-index"></span><span class="stage-state" id="stage-state"></span></div>
        <h3 id="stage-name"></h3>
        <p id="stage-description"></p>
        <button id="stage-reward" class="stage-reward" type="button" hidden></button>
        <div class="stage-footer"><span class="stage-score" id="stage-score"></span><button type="button" class="stage-launch" id="stage-launch"></button></div>
      </div>
    </article>
    <button type="button" class="quiet current-support" id="level-support"></button>
  </section>

  <section id="equipment-screen" class="menu-screen" aria-labelledby="equipment-heading" hidden>
    <div class="page-heading browse-heading">
      <h2 id="equipment-heading" tabindex="-1">装备图鉴</h2>
      <p id="equipment-progress"></p>
    </div>
    <div class="equipment-tools">
      <label class="visually-hidden" for="equipment-search">搜索装备名称</label>
      <input id="equipment-search" type="search" placeholder="搜索装备" autocomplete="off">
      <label class="visually-hidden" for="equipment-filter">按解锁状态筛选</label>
      <select id="equipment-filter"><option value="all">全部</option><option value="owned">已解锁</option><option value="locked">未解锁</option></select>
    </div>
    <div class="equipment-book">
      <div id="equipment-list" class="equipment-list" role="group" aria-label="装备列表"></div>
      <p class="catalog-empty" id="equipment-empty" hidden>没有符合条件的装备。</p>
      <div class="browse-pager catalog-pager" id="equipment-pager">
        <button id="equipment-prev" type="button" class="quiet pager-arrow" aria-label="上一页装备">‹</button>
        <p aria-live="polite" id="equipment-page"></p>
        <button id="equipment-next" type="button" class="quiet pager-arrow" aria-label="下一页装备">›</button>
      </div>
    </div>
    <article id="catalog-detail" class="catalog-detail" aria-labelledby="catalog-name">
      <div class="catalog-heading">
        <span class="catalog-icon" aria-hidden="true"><span class="glyph" id="catalog-glyph"></span></span>
        <div><h3 id="catalog-name"></h3><p id="catalog-source"></p></div>
        <span class="catalog-state" id="catalog-state"></span>
      </div>
      <dl class="catalog-tiers" id="catalog-tiers"></dl>
      <div class="catalog-actions">
        <button id="catalog-source-link" type="button" class="quiet" hidden>查看解锁关卡</button>
        <button id="catalog-support" type="button" class="primary" hidden></button>
      </div>
    </article>
    <p class="catalog-support-note" id="catalog-current" role="status"></p>
  </section>

  <section id="profile-screen" class="menu-screen" aria-labelledby="profile-heading" hidden>
    <div class="page-heading"><h2 id="profile-heading" tabindex="-1">玩家档案</h2><p>战绩和声音设置保存在当前浏览器。</p></div>
    <div class="pilot-card">
      <div class="pilot-avatar" aria-hidden="true"><span class="insignia"></span></div>
      <form class="pilot-form" id="pilot-form">
        <label for="callsign">飞行员代号</label>
        <div><input id="callsign" maxlength="12" required autocomplete="off" value="轨道守卫"><button class="quiet compact" type="submit">保存</button></div>
        <span id="callsign-status" role="status"></span>
      </form>
    </div>
    <dl class="pilot-record">
      <div><dt>已通关</dt><dd id="profile-clears">0 / 16</dd></div>
      <div><dt>完成对局</dt><dd id="profile-runs">0</dd></div>
      <div><dt>累计击毁</dt><dd id="profile-kills">0</dd></div>
    </dl>
    <section class="audio-settings" aria-labelledby="audio-heading">
      <h3 id="audio-heading">声音设置</h3>
      <div class="setting-row"><span id="music-label">背景音乐</span><button class="toggle" id="profile-music" role="switch" aria-checked="true" aria-labelledby="music-label"><span aria-hidden="true">开</span></button></div>
      <div class="setting-row"><span id="sfx-label">战斗与界面音效</span><button class="toggle" id="profile-sfx" role="switch" aria-checked="true" aria-labelledby="sfx-label"><span aria-hidden="true">开</span></button></div>
    </section>
  </section>

  <section id="battle-screen" aria-label="战斗界面" tabindex="-1" hidden>
  <section class="arena-shell" aria-label="防守战场">
    <div class="telemetry">
      <div class="core-meter">
        <div class="meter-top"><span><i></i> 核心完整度</span><strong id="hp">100%</strong></div>
        <div class="meter" role="progressbar" aria-label="核心完整度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hp-meter"><b id="hp-fill"></b></div>
      </div>
      <div class="wave-meter">
        <div class="meter-top"><span>怪潮</span><strong id="wave">01 <small>/ 05</small></strong></div>
        <div class="wave-pips" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
      </div>
      <button class="quiet pause-button" id="pause" aria-label="暂停" title="暂停" disabled><span></span></button>
    </div>

    <div class="arena" id="arena">
      <canvas id="battle" width="480" height="420" aria-label="核心、双轨、飞船和来袭敌机"></canvas>
      <div class="arena-status"><i></i><span id="status">系统待命</span></div>
      <div class="arena-bottom">
        <span id="orbit-label" class="orbit-label">外轨 · 射速提升</span>
        <span class="kills"><span id="kills">0</span> 击毁</span>
      </div>
      <div id="overlay" class="overlay" hidden>
        <div class="result">
          <span class="result-label" id="result-label">防守暂停</span>
          <h2 id="result-title">轨道已暂停</h2>
          <p id="result-copy"></p>
          <button class="primary" id="overlay-action">继续防守</button>
          <div class="result-actions">
            <button class="quiet compact" id="overlay-levels">返回关卡</button>
            <button class="quiet compact" id="overlay-retry" hidden>重打本关</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="loadout" aria-label="装备舱">
    <div class="section-head"><h2>装备舱 <span id="count">1 / 6</span></h2><span class="scrap"><i aria-hidden="true"></i><strong id="scrap">6</strong> 废料</span></div>
    <div class="slots" id="slots" role="group" aria-label="装备槽位"></div>
    <div class="equipment-info">
      <div class="equipment-copy"><strong id="gear-name">脉冲弹 I</strong><span id="gear-info">高速单体射击</span></div>
      <div class="equipment-actions">
        <button class="quiet compact" id="recycle" disabled>分解</button>
        <button class="quiet compact fusion" id="fuse" disabled>合成</button>
      </div>
    </div>
  </section>

  <div class="controls">
    <button class="primary" id="start">开始防守 <span aria-hidden="true">→</span></button>
    <button class="primary" id="draw" hidden><span>打捞装备</span><span class="cost"><i aria-hidden="true"></i>4</span></button>
    <button class="secondary" id="switch" hidden><span class="switch-mark" aria-hidden="true">⇄</span> 切内轨 <kbd>空格</kbd></button>
  </div>
  <p class="hint" id="hint" role="status">守住 5 波怪潮。绕圈赚废料，打捞装备，再合成升级。</p>
  </section>

function readPreference(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem('orbit-guard:' + key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function writePreference(key, value) {
  try {
    localStorage.setItem('orbit-guard:' + key, JSON.stringify(value));
  } catch {
    // A browser can disable storage for local files.
  }
}

let overlayAction;
let lastNote = 0;
let support = readPreference('support', '');
let game = createGame('ready');

function createGame(mode, stage = STAGES[0]) {
  return {
    mode, stage, hp: 100, wave: 0, kills: 0, scrap: 6, turns: 0, draws: 0, selected: 0,
    angle: START_ANGLE, orbit: 'outer', radius: ORBITS.outer, rotation: 0, innerTravel: 0, time: 0,
    spawnDelay: 1.1, spawned: 0, respite: null, lastSpawnAngle: .1, bossDefeated: false,
    kit: [moduleFor(stage.starter), null, null, null, null, null],
    enemies: [], effects: [], sparks: [], shotSounds: {}, notice: '', noticeTimer: 0, coreFlash: 0,
    support: gearUnlocked(support) ? support : '', waitingTrial: false, trialPair: false, trialIssued: false,
    blades: [], wells: [], missiles: [], sentry: null, sentryReadyAt: 0, railHeld: 0, resonatorReadyAt: 0,
    mines: [], reclaimed: 0, capacitorCharged: false,
    aftershockReadyAt: 0, interference: null, interferenceAt: 0, jammedUntil: 0, overdriveUntil: 0,
  };
}

function moduleFor(kind, tier = 1) {
  return {kind, tier, readyIn: 0};
}

function syncMusic() {
  const track = ui.music;
  track.volume = screen === 'battle' ? (game.mode === 'playing' ? .51 : .26) : .36;
  if (!musicOn || document.hidden) {
    if (!track.paused) track.pause();
  } else if (audioActivated && track.paused) {
    track.play().catch(() => {});
  }
}

function syncAudioButtons() {
  ui.sound.setAttribute('aria-pressed', String(musicOn));
  ui.sound.setAttribute('aria-label', musicOn ? '关闭背景音乐' : '开启背景音乐');
  for (const [button, enabled] of [[ui['profile-music'], musicOn], [ui['profile-sfx'], soundOn]]) {
    button.setAttribute('aria-checked', String(enabled));
    button.firstElementChild.textContent = enabled ? '开' : '关';
  }
}

function toggleMusic() {
  musicOn = !musicOn;
  writePreference('music', musicOn);
  syncAudioButtons();
  syncMusic();
}

function prepareAudio() {
  if (!soundOn) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  try {
    if (!audio && Audio) audio = new Audio();
  } catch {
    return;
  }
  if (audio?.state === 'suspended') audio.resume().catch(() => {});
}

function notes(frequencies, type = 'sine', volume = .09) {
  if (!soundOn || audio?.state !== 'running') return;
  frequencies.forEach((frequency, index) => {
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    const start = audio.currentTime + index * .065;
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    oscillator.frequency.exponentialRampToValueAtTime(frequency * .87, start + .13);
    gain.gain.setValueAtTime(.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + .015);
    gain.gain.exponentialRampToValueAtTime(.0001, start + .16);
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start(start);
    oscillator.stop(start + .17);
  });
}

function unlocked(index) {
  return Boolean(STAGES[index] && (index === 0 || profile.records[STAGES[index - 1].id]?.clear));
}

function gearUnlocked(kind) {
  const stage = GEAR_SOURCES.get(kind);
  return Boolean(stage && profile.records[stage.id]?.clear);
}

function stageRecord(record) {
  if (!record) return '—';
  return record.clear ? `通关 · ${record.kills} 击毁` : `第 ${record.wave} 波`;
}

function showScreen(next, focus = true) {
  if (next === 'levels' && screen === 'battle') {
    selectedStageIndex = game.mode === 'won' && unlocked(game.stage.id) ? game.stage.id : game.stage.id - 1;
  }
  screen = next;
  const battle = next === 'battle';
  for (const name of ['home', 'levels', 'equipment', 'profile', 'battle']) ui[name + '-screen'].hidden = next !== name;
  ui['main-nav'].hidden = battle;
  ui['battle-record'].hidden = !battle;
  ui['header-caption'].textContent = battle ? `第 ${game.stage.id} 关 · ${game.stage.name}` : '轨道合成塔防';
  for (const button of ui['main-nav'].querySelectorAll('[data-screen]')) {
    if (button.dataset.screen === next) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  }
  if (!battle) syncProgress();
  if (next === 'levels') renderLevelPage();
  if (next === 'equipment') renderEquipmentPage();
  syncMusic();
  if (focus) {
    const target = battle ? ui['battle-screen'] : ui[next + '-heading'];
    target.focus({preventScroll: true});
    window.scrollTo(0, 0);
  }
}

function launchStage(index) {
  if (!unlocked(index)) return;
  const stage = STAGES[index];
  if (game.mode === 'paused' && game.stage.id === stage.id) {
    showScreen('battle');
    togglePause();
    return;
  }
  start(stage);
}

function matchFor(index) {
  const item = game.kit[index];
  if (!item || item.tier === 3) return -1;
  return game.kit.findIndex((other, otherIndex) => otherIndex !== index &&
    other?.kind === item.kind && other.tier === item.tier);
}

function syncHud() {
  ui.record.textContent = stageRecord(profile.records[game.stage.id]);
  ui.hp.textContent = game.hp + '%';
  ui['hp-meter'].setAttribute('aria-valuenow', game.hp);
  ui['hp-fill'].style.width = game.hp + '%';
  ui['hp-fill'].classList.toggle('danger', game.hp <= 30);
  ui.wave.firstChild.nodeValue = String(game.wave + 1).padStart(2, '0') + ' ';
  pips.forEach((pip, index) => {
    pip.classList.toggle('now', index === game.wave && game.mode !== 'won');
    pip.classList.toggle('done', index < game.wave || game.mode === 'won');
  });
  ui.kills.textContent = game.kills;
  const resonanceReady = game.railHeld >= RESONANCE_CHARGE && game.time >= game.resonatorReadyAt && equippedTier('resonator') > 0;
  const overdriveReady = game.time < game.overdriveUntil;
  const orbit = game.orbit === 'outer' ? '外轨' : '内轨';
  const orbitEffect = (overdriveReady && '电枢提速') || (resonanceReady && '共振就绪') || (game.capacitorCharged && '电容已充能') ||
    (game.orbit === 'outer' ? '射速 +45%' : '蓄积维修');
  ui['orbit-label'].textContent = orbit + ' · ' + orbitEffect;
  ui['orbit-label'].classList.toggle('inner', game.orbit === 'inner');
  ui['orbit-label'].classList.toggle('charged', resonanceReady || overdriveReady);
  ui.pause.disabled = game.mode !== 'playing' && game.mode !== 'paused';
  ui.pause.setAttribute('aria-label', game.mode === 'paused' ? '继续' : '暂停');
  ui.pause.title = ui.pause.getAttribute('aria-label');

  const active = game.mode === 'playing';
  ui.start.hidden = game.mode !== 'ready';
  ui.draw.hidden = ui.switch.hidden = game.mode === 'ready';
  ui.draw.disabled = !active || game.scrap < DRAW_COST || !game.kit.includes(null);
  ui.switch.disabled = !active;
  ui.switch.childNodes[1].nodeValue = game.orbit === 'outer' ? ' 切内轨 ' : ' 切外轨 ';
  ui.count.textContent = game.kit.filter(Boolean).length + ' / ' + game.kit.length;
  ui.scrap.textContent = game.scrap;
  const selected = game.kit[game.selected];
  const match = matchFor(game.selected);
  slotButtons.forEach((button, index) => {
    const item = game.kit[index];
    const signature = item ? item.kind + item.tier : '';
    if (button.dataset.signature !== signature) {
      button.dataset.signature = signature;
      button.replaceChildren();
      if (item) {
        button.dataset.kind = item.kind;
        const glyph = document.createElement('span');
        glyph.className = 'glyph ' + item.kind;
        glyph.setAttribute('aria-hidden', 'true');
        const tier = document.createElement('span');
        tier.className = 'tier';
        tier.textContent = TIERS[item.tier - 1];
        button.append(glyph, tier);
      } else {
        delete button.dataset.kind;
        const glyph = document.createElement('span');
        glyph.className = 'empty';
        glyph.textContent = '+';
        glyph.setAttribute('aria-hidden', 'true');
        button.append(glyph);
      }
      button.setAttribute('aria-label', item ?
        `槽位 ${index + 1}，${GEAR[item.kind].name} ${TIERS[item.tier - 1]}` : `空槽位 ${index + 1}`);
    }
    button.disabled = !item && (!active || ui.draw.disabled);
    button.setAttribute('aria-pressed', String(Boolean(item) && index === game.selected));
    button.classList.toggle('candidate', active && Boolean(selected && item && index !== game.selected &&
      selected.tier < 3 && selected.kind === item.kind && selected.tier === item.tier));
  });
  ui['gear-name'].textContent = selected ? GEAR[selected.kind].name + ' ' + TIERS[selected.tier - 1] : '装备槽已空';
  ui['gear-info'].textContent = selected ? GEAR[selected.kind].descriptions[selected.tier - 1] : '打捞一件装备即可恢复火力';
  ui.fuse.disabled = !active || match === -1;
  ui.recycle.disabled = !active || !selected || game.kit.filter(Boolean).length <= 1;
  ui.recycle.title = selected ? '返还 ' + (selected.tier + 1) + ' 废料' : '分解';
  syncNotice();
}

function syncNotice() {
  const bossIncoming = game.wave === game.stage.waves.length - 1 && !game.bossDefeated;
  const boss = game.enemies.find(enemy => enemy.kind === 'boss');
  const shielded = boss?.shield > 0;
  const escorted = Boolean(boss && activeEscort(boss));
  const interferenceOrbit = game.interference?.orbit;
  const jammed = game.time < game.jammedUntil;
  const charging = game.enemies.some(isChargingBreacher);
  const armorThreat = game.orbit === 'outer' &&
    game.enemies.some(enemy => enemy.plated && distance(CENTER, enemy) < ORBITS.outer + 24);
  const lockedOrbit = boss?.lockedOrbit;
  const attackWarning = lockedOrbit ? (lockedOrbit === 'outer' ? '外轨锁定 · 切内轨' : '内轨锁定 · 切外轨') : '';
  const interferenceWarning = interferenceOrbit ? (interferenceOrbit === 'outer' ? '外轨干扰预警' : '内轨干扰预警') : '';
  const status = {
    ready: '系统待命', paused: '防守暂停', won: '威胁解除', lost: '防守中断',
    playing: attackWarning || interferenceWarning || (jammed ? '武器受到干扰' : '') ||
      (shielded ? '首领护盾 · 内轨破盾' : '') || (escorted ? '首领受到护航' : '') || (game.respite !== null ? '波次间歇' :
      game.bossDefeated ? '清理残余敌机' : game.stage.waves[game.wave].name),
  }[game.mode];
  ui.status.textContent = status;
  ui.status.parentElement.classList.toggle('boss', bossIncoming && game.mode === 'playing');
  ui.status.parentElement.classList.toggle('interference', Boolean(interferenceWarning || jammed) && !attackWarning && game.mode === 'playing');
  let hint = INTRO;
  if (game.mode === 'playing') {
    if (attackWarning) hint = game.orbit === lockedOrbit ? game.stage.boss + '即将攻击当前轨道，立即切轨！' : '已避开锁定轨道，等冲击结束再切回。';
    else if (interferenceWarning) hint = game.orbit === interferenceOrbit ? '切到另一条轨道，避开即将造成停火的干扰。' : '当前轨道安全，等干扰结束再切回。';
    else if (jammed) hint = '武器短暂停火，冷却完会自动恢复。';
    else if (shielded) hint = game.orbit === 'outer' ? '切入内轨攻击，打碎裂隙守卫的护盾。' : '内轨正在破盾，留意下一次锁轨预警。';
    else if (escorted) hint = '顺着金色光束找到护航舰，击毁它或用断链脉冲解除保护。';
    else if (armorThreat) hint = '重装舰正在接近，切内轨可打出完整伤害。';
    else if (game.waitingTrial) hint = '试装已到。合成或分解腾出一格，自动装入。';
    else if (game.noticeTimer > 0) hint = game.notice;
    else if (game.trialPair) hint = '下次打捞必出 ' + GEAR[game.stage.reward].name + '，可与试装合成。';
    else if (charging) hint = '攻城炮舰正在瞄准核心，击毁它或用震荡钉打断。';
    else if (matchFor(game.selected) >= 0) hint = '两件同名同级装备可以合成。';
    else if (game.draws === 0) hint = `先打捞一件装备，试试合成${GEAR[game.stage.starter].name}。`;
    else if (!game.kit.includes(null)) hint = '装备舱已满，可以合成或分解腾出空位。';
    else hint = '外轨射速 +45%。一圈内半程走内轨，过线维修 5%。';
  } else if (game.mode === 'paused') hint = '继续防守即可返回当前战斗。';
  else if (game.mode === 'won' || game.mode === 'lost') hint = '重新出击可以尝试另一种装备组合。';
  if (ui.hint.textContent !== hint) ui.hint.textContent = hint;
}

function announce(message, seconds = 2.6) {
  game.notice = message;
  game.noticeTimer = seconds;
}

function start(stage = game.stage) {
  prepareAudio();
  game = createGame('playing', stage);
  ui['battle-screen'].dataset.stage = stage.id;
  showScreen('battle');
  lastNote = 0;
  ui.overlay.hidden = true;
  notes([330, 495]);
  syncHud();
}

function togglePause() {
  if (game.mode === 'paused') {
    game.mode = 'playing';
    ui.overlay.hidden = true;
    ui.pause.focus({preventScroll: true});
  } else if (game.mode === 'playing') {
    game.mode = 'paused';
    showOverlay('防守暂停', '轨道已暂停', '第 ' + (game.wave + 1) + ' 波 · 剩余核心 ' + game.hp + '%', '继续防守', togglePause);
  }
  syncMusic();
  syncHud();
}

function showOverlay(label, title, detail, labelAction, action, showRetry = false) {
  ui['result-label'].textContent = label;
  ui['result-title'].textContent = title;
  ui['result-copy'].textContent = detail;
  overlayAction = action;
  ui['overlay-action'].textContent = labelAction;
  ui['overlay-retry'].hidden = !showRetry;
  ui.overlay.hidden = false;
  ui['overlay-action'].focus({preventScroll: true});
}

function endGame(clear, cause) {
  if (game.mode !== 'playing') return;
  game.mode = clear ? 'won' : 'lost';
  const record = {clear, wave: game.wave + 1, kills: game.kills};
  const best = profile.records[game.stage.id];
  if (!best || Number(clear) > Number(best.clear) ||
      (clear === best.clear && (record.wave > best.wave || (record.wave === best.wave && record.kills > best.kills)))) {
    profile.records[game.stage.id] = record;
  }
  profile.runs += 1;
  profile.kills += record.kills;
  writePreference('profile', profile);
  const earned = clear && !best?.clear && game.stage.reward;
  const reward = earned ? ' · 解锁 ' + GEAR[earned].name : '';
  const summary = `第 ${record.wave} 波 · 击毁 ${record.kills} 架敌机` + reward;
  const canAdvance = clear && game.stage.id < STAGES.length;
  const title = clear ? (canAdvance ? '星核守住了' : '全部战区已守住') : '星核失守';
  showOverlay(clear ? '防守成功' : '防守失败', title, cause + '。' + summary,
    canAdvance ? '下一关' : '重新出击', canAdvance ? () => launchStage(game.stage.id) : () => start(), canAdvance);
  notes(clear ? [440, 550, 660, 880] : [260, 180, 110], 'triangle');
  syncMusic();
  syncHud();
}

function issueTrial() {
  const index = game.kit.indexOf(null);
  if (!game.waitingTrial || index === -1) return;
  const kind = game.stage.reward;
  game.waitingTrial = false;
  game.trialIssued = true;
  game.trialPair = true;
  game.kit[index] = moduleFor(kind);
  game.selected = index;
  announce(GEAR[kind].name + ' I 已装入，下次打捞可获得同名装备。', 4.2);
  notes([420, 580, 760], 'triangle');
}

function gearPool() {
  const {support, stage, trialIssued} = game;
  const kinds = [...BASE_GEAR];
  if (support && support !== stage.reward) kinds.push(support);
  if (trialIssued) kinds.push(stage.reward);
  return kinds;
}

function drawGear(preferredIndex = null) {
  if (game.mode !== 'playing' || game.scrap < DRAW_COST) return;
  const index = preferredIndex ?? game.kit.indexOf(null);
  if (index < 0 || game.kit[index]) return;
  const kinds = gearPool();
  const firstDraws = [game.stage.starter, ...BASE_GEAR.filter(kind => kind !== game.stage.starter)];
  const kind = game.trialPair ? game.stage.reward :
    (firstDraws[game.draws] ?? kinds[Math.floor(Math.random() * kinds.length)]);
  game.trialPair = false;
  game.kit[index] = moduleFor(kind);
  game.selected = index;
  game.scrap -= DRAW_COST;
  game.draws += 1;
  announce(matchFor(index) === -1 ? '已打捞 ' + GEAR[kind].name + ' I' : '打捞到同名装备，点击「合成」升级。');
  notes([410, 620]);
  syncHud();
}

function selectSlot(index) {
  if (!game.kit[index]) {
    drawGear(index);
    return;
  }
  const item = game.kit[index];
  const selected = game.kit[game.selected];
  if (game.mode === 'playing' && index !== game.selected && selected &&
      item.tier < 3 && selected.kind === item.kind && selected.tier === item.tier) {
    fuseGear(index);
    return;
  }
  game.selected = index;
  syncHud();
}

function fuseGear(otherIndex = matchFor(game.selected)) {
  if (game.mode !== 'playing' || otherIndex < 0) return;
  const item = game.kit[game.selected];
  game.kit[game.selected] = moduleFor(item.kind, item.tier + 1);
  game.kit[otherIndex] = null;
  const spec = GEAR[item.kind];
  const ship = port(game.radius, game.angle);
  splash(ship, 24, spec.color, 18);
  ripple(ship, 60, spec.color);
  announce(`${spec.name} ${TIERS[item.tier]} · ${spec.descriptions[item.tier]}`, 3.1);
  notes([460, 610, 810], 'triangle');
  issueTrial();
  syncHud();
}

function recycleGear() {
  const item = game.kit[game.selected];
  if (game.mode !== 'playing' || !item || game.kit.filter(Boolean).length <= 1) return;
  const value = item.tier + 1;
  game.scrap += value;
  game.kit[game.selected] = null;
  if (item.kind === 'capacitor' && !equippedTier('capacitor')) game.capacitorCharged = false;
  game.selected = game.kit.findIndex(Boolean);
  announce('装备已分解，废料 +' + value);
  notes([390, 270]);
  issueTrial();
  syncHud();
}

function switchOrbit() {
  if (game.mode !== 'playing') return;
  const previous = game.orbit;
  game.orbit = otherOrbit(previous);
  const ship = port(game.radius, game.angle);
  ripple(ship, 34, game.orbit === 'inner' ? '#83dfec' : '#dfff80');
  announce(game.orbit === 'inner' ? '一圈内半程走内轨，过线维修 5%。' : '外轨：所有装备射速 +45%。');
  activateSwitchGear(previous);
  game.railHeld = 0;
  notes(game.orbit === 'inner' ? [510, 320] : [350, 520]);
  syncHud();
}

function port(radius, angle) {
  return {x: CENTER.x + Math.cos(angle) * radius, y: CENTER.y + Math.sin(angle) * radius};
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function spawnEnemy() {
  const {wave, stage, spawned: index} = game;
  const encounter = stage.waves[wave];
  let kind = 'seeker';
  if (wave === stage.waves.length - 1 && index === 9) kind = 'boss';
  else if (encounter.escortsAt?.includes(index)) kind = 'escort';
  else if (encounter.cargoAt?.includes(index)) kind = 'cargo';
  else if (encounter.splittersAt?.includes(index)) kind = 'splitter';
  else if (encounter.breachersAt?.includes(index)) kind = 'breacher';
  else if (stage.gunners && wave >= 1 && index % 4 === 1) kind = 'gunner';
  else if ((stage.id === 3 && wave >= 1 && index % 3 === 2) || (wave >= 2 && index % 4 === 3)) kind = 'armor';
  else if ((stage.id === 2 && index % 2 === 1) || (wave >= 1 && index % 3 === 2)) kind = 'dart';
  const angle = escortEntryAngle(encounter, index, wave) ?? formationAngle(stage.formation, index, wave);
  game.lastSpawnAngle = angle;
  const boundary = Math.min((WIDTH / 2 - 12) / Math.abs(Math.cos(angle)),
    (HEIGHT / 2 - 12) / Math.abs(Math.sin(angle)));
  const radius = kind === 'cargo' ? ORBITS.outer + 24 : kind === 'boss' ? Math.min(boundary, 189) : boundary;
  const enemy = addEnemy(kind, angle, radius);
  if (kind === 'dart' && stage.skirting && wave >= 1) enemy.skirtDirection = index % 2 ? -1 : 1;
  if (kind === 'cargo') {
    enemy.cargoAge = 0;
    enemy.cargoDirection = index % 2 ? -1 : 1;
    announce('搬运舰正在外圈撤离。击毁可额外回收 3 废料。', 2.5);
  } else if (kind === 'escort' && wave === 1) {
    announce('护航舰会用金色光束保护邻近敌机。', 3.2);
  } else if (kind === 'splitter' && wave === 1) {
    announce('分裂舰被击毁时会放出两架碎片机。', 2.55);
  }
}

function addEnemy(kind, angle, radius) {
  const {stage, wave} = game;
  const spec = ENEMY[kind];
  const pressure = stage.waves[wave].pressure ?? 0;
  const plated = kind === 'armor' && Boolean(stage.heavyArmor);
  const health = kind === 'boss' ? stage.bossHp : spec.health * (1 + wave * .32 + pressure) * (plated ? 1.46 : 1);
  const enemy = {
    ...port(radius, angle), angle, kind, maxHealth: health, health, slow: 0, stop: 0, flash: 0,
    size: spec.size, speed: kind === 'boss' ? (stage.bossSpeed ?? spec.speed) :
      spec.speed * (1 + wave * .095 + pressure * .22),
    plated, canDash: kind === 'dart' && Boolean(stage.dash), dashing: false, dead: false,
  };
  game.enemies.push(enemy);
  if (kind === 'gunner') {
    enemy.shots = 0;
    enemy.launchIn = 1.05;
  }
  if (kind === 'boss') {
    enemy.pulseTimer = 2.3;
    enemy.lockedOrbit = null;
    enemy.shield = stage.shield ?? 0;
    if (stage.relayBoss) {
      enemy.relayPhase = 'recovery';
      enemy.relayAt = game.time + .95;
    }
    announce(`首领${stage.boss}出现，留意轨道上的攻击预警。`, 4);
    notes([175, 142, 112], 'triangle');
  }
  return enemy;
}

function closest(source, range, targets) {
  let result = null;
  let bestDistance = range;
  for (const enemy of targets) {
    if (enemy.dead) continue;
    const gap = distance(source, enemy);
    if (gap < bestDistance) {
      bestDistance = gap;
      result = enemy;
    }
  }
  return result;
}

function attack(item, origin) {
  const spec = GEAR[item.kind];
  if (!spec.cooldown) return;
  if (item.kind === 'disruptor' || item.kind === 'mine') {
    activateOuterWeapon(item, origin);
    return;
  }
  if (item.kind === 'spike') {
    fireStaggerSpike(item, origin);
    return;
  }
  if (item.kind === 'deflector') {
    interceptMissiles(item, origin);
    return;
  }
  const target = closest(origin, spec.range, game.enemies);
  if (!target) return;
  if (item.kind === 'blade' || item.kind === 'well') {
    launchSpecial(item, origin, target);
    return;
  }
  const damage = spec.damage[item.tier - 1];
  const hits = [target];
  if (item.kind === 'pulse' && item.tier === 3) {
    const options = game.enemies.filter(enemy => enemy !== target && !enemy.dead);
    const second = closest(origin, spec.range, options);
    if (second) hits.push(second);
    const third = closest(origin, spec.range, options.filter(enemy => enemy !== second));
    if (third) hits.push(third);
  }
  if (item.kind === 'arc') {
    const limit = [2, 3, 5][item.tier - 1];
    while (hits.length < limit) {
      const from = hits[hits.length - 1];
      const next = closest(from, 71 + item.tier * 11, game.enemies.filter(enemy => !hits.includes(enemy)));
      if (!next) break;
      hits.push(next);
    }
  }
  if (item.kind === 'frost') {
    const size = [37, 54, 77][item.tier - 1];
    frostBurst(origin, target, size, item.tier);
    hits.push(...game.enemies.filter(enemy => enemy !== target && !enemy.dead && distance(target, enemy) < size));
  }
  hits.forEach((enemy, index) => {
    if (item.kind === 'frost') {
      enemy.slow = 1.9;
      if (item.tier === 3 && enemy.kind !== 'boss') enemy.stop = .42;
    }
    if (item.kind === 'pulse') pulseBolt(origin, enemy, item.tier);
    if (item.kind === 'arc') electricArc(index > 0 ? hits[index - 1] : origin, enemy, item.tier);
    enemy.hitColor = spec.color;
    const elementBonus = item.kind === 'pulse' ? 1 : gravityBonus(enemy);
    strike(enemy, damage * (index ? .71 : 1) * elementBonus);
  });
  recoverWeapon(item);
}

function recoverWeapon(item) {
  playShot(item.kind);
  const overdrive = game.time < game.overdriveUntil ? 1.3 : 1;
  item.readyIn = GEAR[item.kind].cooldown / (game.orbit === 'outer' ? 1.45 : 1) / overdrive * (item.tier === 3 ? .85 : 1);
}

function strike(enemy, damage, orbit = game.orbit) {
  if (enemy.dead) return;
  if (enemy.shield > 0) {
    enemy.hitColor = SHIELD_COLOR;
    enemy.flash = .09;
    if (orbit === 'outer') return;
    enemy.shield = Math.max(0, enemy.shield - damage);
    if (enemy.shield === 0) {
      ripple(enemy, 76, SHIELD_COLOR);
      splash(enemy, 36, SHIELD_COLOR, 25);
      announce('护盾已破。避开预警后，可切外轨提高射速。', 3.4);
      notes([500, 665, 800], 'triangle');
    }
    return;
  }
  const armorScale = enemy.plated && orbit === 'outer' ? .42 : 1;
  const escortScale = activeEscort(enemy) ? .65 : 1;
  enemy.health -= damage * armorScale * escortScale;
  enemy.flash = .09;
  if (enemy.health > 0) return;
  enemy.dead = true;
  game.kills += 1;
  // Keep the first wave's upgrade pace predictable on every stage.
  const salvageEvery = game.wave === 0 ? 1 : (game.stage.salvageEvery ?? 1);
  if (enemy.kind === 'boss') game.scrap += 6;
  else if (game.kills % salvageEvery === 0) game.scrap += 1;
  if (enemy.kind === 'cargo') {
    game.scrap += 3;
    announce('搬运舰已拦截 · 额外废料 +3', 2);
  }
  reclaimSalvage();
  onFinaleDefeat(enemy, orbit);
  splash(enemy, enemy.size, ENEMY[enemy.kind].color, enemy.kind === 'boss' ? 32 : 8);
  if (enemy.kind === 'boss') {
    game.bossDefeated = true;
    ripple(enemy, 86, '#ffc0bb');
    announce(game.stage.boss + '已击毁，清理剩余敌机。', 3.8);
    notes([330, 490, 700], 'triangle');
  } else if (game.time - lastNote > .20) {
    notes([190 + Math.random() * 100], 'sine', .027);
    lastNote = game.time;
  }
}

function nextWave() {
  game.wave += 1;
  game.reclaimed = 0;
  game.interference = null;
  game.interferenceAt = game.time + 3.25;
  game.spawned = 0;
  game.spawnDelay = .65;
  game.respite = null;
  announce('第 ' + (game.wave + 1) + ' 波 · ' + game.stage.waves[game.wave].name);
  notes([295, 410], 'triangle');
}

function updateBossPulse(enemy, dt) {
  enemy.pulseTimer -= dt;
  if (enemy.pulseTimer > 0) return;
  if (!enemy.lockedOrbit) {
    enemy.lockedOrbit = game.stage.alternatingLocks && enemy.lastLock ? otherOrbit(enemy.lastLock) : game.orbit;
    enemy.lastLock = enemy.lockedOrbit;
    enemy.pulseTimer = game.stage.bossWarning;
    if (game.stage.gunners) launchMissile(enemy);
    notes([230, 230], 'triangle', .075);
    return;
  }
  const radius = ORBITS[enemy.lockedOrbit];
  ripple(CENTER, radius + 12, '#ff7c97');
  const sameRail = Math.abs(game.radius - radius) < (ORBITS.outer - ORBITS.inner) / 2;
  if (sameRail) {
    game.hp = Math.max(0, game.hp - game.stage.bossDamage);
    game.coreFlash = .43;
    announce(`未躲开轨道冲击，核心受损 ${game.stage.bossDamage}%。`);
    notes([135, 100], 'triangle', .1);
    if (game.hp === 0) endGame(false, '核心被轨道冲击击毁');
  } else {
    announce('已躲开轨道冲击。', 1.5);
    notes([455], 'sine', .055);
  }
  enemy.lockedOrbit = null;
  enemy.pulseTimer = game.stage.bossInterval;
}

function advance(dt) {
  game.time += dt;
  game.railHeld += dt;
  const wasNotice = game.noticeTimer > 0;
  game.noticeTimer -= dt;
  game.coreFlash = Math.max(0, game.coreFlash - dt);
  game.radius += (ORBITS[game.orbit] - game.radius) * Math.min(1, dt * 9);
  const increment = dt * FULL_TURN / 7;
  game.angle = (game.angle + increment) % FULL_TURN;
  if (game.orbit === 'inner') game.innerTravel += Math.min(increment, FULL_TURN - game.rotation);
  game.rotation += increment;
  if (game.rotation >= FULL_TURN) {
    game.rotation -= FULL_TURN;
    game.turns += 1;
    game.scrap += 2;
    const innerLap = game.innerTravel >= Math.PI;
    const repaired = innerLap ? Math.min(5, 100 - game.hp) : 0;
    if (innerLap && equippedTier('capacitor')) game.capacitorCharged = true;
    chargeDynamo();
    game.innerTravel = game.orbit === 'inner' ? game.rotation : 0;
    game.hp += repaired;
    ripple(port(ORBITS[game.orbit], START_ANGLE), 32, '#dfff80');
    if (repaired) announce('完成一圈 · 废料 +2 · 核心维修 ' + repaired + '%');
    else if (!wasNotice) announce('完成一圈 · 废料 +2', 1.3);
  }
  if (game.respite !== null) {
    game.respite -= dt;
    if (game.respite <= 0) nextWave();
    if (game.mode !== 'playing') return;
  } else if (game.spawned < game.stage.waves[game.wave].count) {
    game.spawnDelay -= dt;
    if (game.spawnDelay <= 0) {
      spawnEnemy();
      game.spawned += 1;
      game.spawnDelay += game.stage.waves[game.wave].gap;
    }
  }

  advanceInterference();
  for (const enemy of game.enemies) {
    if (enemy.dead) continue;
    if (enemy.kind === 'boss') {
      updateOuterBoss(enemy, dt);
      if (game.mode !== 'playing') return;
    }
    const spec = ENEMY[enemy.kind];
    enemy.slow -= dt;
    enemy.stop -= dt;
    enemy.flash -= dt;
    const remaining = distance(CENTER, enemy);
    if (enemy.kind === 'cargo') {
      advanceCargo(enemy, dt);
      continue;
    }
    if (enemy.skirtDirection && advanceSkirting(enemy, remaining, dt)) continue;
    if (enemy.kind === 'gunner' && remaining <= 151 && updateGunner(enemy, dt)) continue;
    if (enemy.kind === 'breacher' && remaining <= BREACHER_RANGE && updateBreacher(enemy, dt)) {
      if (game.mode !== 'playing') return;
      continue;
    }
    enemy.dashing = enemy.canDash && remaining <= ORBITS.outer && enemy.slow <= 0;
    const speedScale = enemy.dashing ? 1.66 : enemy.slow > 0 ? (enemy.kind === 'boss' ? .87 : .65) : 1;
    const escortPace = enemy.relayPhase === 'escort' ? .55 : 1;
    const speed = enemy.stop > 0 ? 0 : enemy.speed * speedScale * escortPace;
    if (remaining <= 23 + enemy.size * .4) {
      const impact = bufferImpact(spec.impact, enemy.kind);
      game.hp = Math.max(0, game.hp - impact);
      if (impact > 0) game.coreFlash = .4;
      enemy.dead = true;
      const impactColor = impact > 0 ? '#ff848d' : GEAR.capacitor.color;
      ripple(enemy, 66, impactColor);
      splash(enemy, 12, impactColor, 17);
      notes([105], 'triangle', .105);
      if (game.hp <= 0) {
        endGame(false, enemy.kind === 'boss' ? game.stage.boss + '撞入了核心' : '核心完整度归零');
        return;
      }
    } else {
      enemy.x += (CENTER.x - enemy.x) / remaining * speed * dt;
      enemy.y += (CENTER.y - enemy.y) / remaining * speed * dt;
    }
  }
  if (game.stage.escorts) updateEscortLinks();
  const ship = port(game.radius, game.angle);
  const canFire = game.time >= game.jammedUntil;
  for (const item of game.kit) {
    if (!item || !GEAR[item.kind].cooldown) continue;
    item.readyIn -= dt;
    if (canFire && item.readyIn <= 0) attack(item, ship);
  }
  advanceMines(dt);
  advanceSpecialWeapons(dt);
  advanceMissiles(dt);
  if (game.mode !== 'playing') return;
  game.enemies = game.enemies.filter(enemy => !enemy.dead);
  if (game.respite === null && game.spawned === game.stage.waves[game.wave].count &&
      !game.enemies.length && !game.missiles.length) {
    if (game.wave === game.stage.waves.length - 1) {
      endGame(true, game.stage.boss + '已击毁');
      return;
    }
    game.respite = 2.2;
    announce('第 ' + (game.wave + 1) + ' 波完成，整理装备迎接下一波。', 2.1);
    if (game.wave === 1 && game.stage.reward) {
      game.respite = 4;
      game.waitingTrial = true;
      issueTrial();
    }
  }
  animateEffects(dt);
}

const SHOT_SOUNDS = {
  pulse: {frequencies: [860], type: 'triangle', volume: .024},
  frost: {frequencies: [1140, 950], type: 'sine', volume: .033},
  arc: {frequencies: [166, 430], type: 'square', volume: .013},
  blade: {frequencies: [720, 390], type: 'triangle', volume: .027},
  well: {frequencies: [186, 128], type: 'sine', volume: .05},
  sentry: {frequencies: [560, 680], type: 'triangle', volume: .022},
  deflector: {frequencies: [1040, 725], type: 'sine', volume: .035},
  resonator: {frequencies: [120, 170, 254], type: 'triangle', volume: .045},
  disruptor: {frequencies: [910, 600, 340], type: 'sine', volume: .036},
  mine: {frequencies: [420, 270], type: 'triangle', volume: .026},
  spike: {frequencies: [540, 298], type: 'triangle', volume: .032},
};

function playShot(kind) {
  if (game.time - (game.shotSounds[kind] ?? -1) < .18) return;
  game.shotSounds[kind] = game.time;
  const shot = SHOT_SOUNDS[kind];
  notes(shot.frequencies, shot.type, shot.volume);
}

function pulseBolt(from, to, tier) {
  const travel = Math.max(.045, distance(from, to) / 1730);
  const life = travel + .115;
  game.effects.push({kind: 'pulse', from: {...from}, to: {x: to.x, y: to.y}, tier, travel, ttl: life, life});
}

function frostBurst(from, to, size, tier) {
  const travel = Math.max(.075, distance(from, to) / 1450);
  const life = travel + .58;
  game.effects.push({kind: 'frost', from: {...from}, to: {x: to.x, y: to.y}, size, tier, travel, ttl: life, life});
}

function electricArc(from, to, tier) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const length = Math.max(1, distance(from, to));
  const direction = Math.atan2(dy, dx);
  const steps = Math.max(3, Math.ceil(length / 22));
  const points = [{x: from.x, y: from.y}];
  const branches = [];
  for (let step = 1; step < steps; step++) {
    const offset = (Math.random() - .5) * (14 + tier * 5);
    const point = {x: from.x + dx * step / steps + dy / length * offset,
      y: from.y + dy * step / steps - dx / length * offset};
    points.push(point);
    if (step % 2 && branches.length < tier + 1) {
      const a = direction + (step % 4 === 1 ? .83 : -.94);
      const size = 9 + tier * 3 + Math.random() * 12;
      branches.push([point, {x: point.x + Math.cos(a) * size, y: point.y + Math.sin(a) * size},
        {x: point.x + Math.cos(a + .23) * size * 1.7, y: point.y + Math.sin(a + .23) * size * 1.7}]);
    }
  }
  points.push({x: to.x, y: to.y});
  game.effects.push({kind: 'arc', points, branches, tier, ttl: .235, life: .235});
}

function ripple(origin, size, color) {
  game.effects.push({kind: 'ripple', x: origin.x, y: origin.y, size, color, ttl: .47, life: .47});
}

function splash(origin, radius, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * FULL_TURN;
    const speed = 22 + Math.random() * (radius + 66);
    const life = .24 + Math.random() * .37;
    game.sparks.push({x: origin.x, y: origin.y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
      size: 1 + Math.random() * 2, color, ttl: life, life});
  }
}

function animateEffects(dt) {
  for (const effect of game.effects) effect.ttl -= dt;
  game.effects = game.effects.filter(effect => effect.ttl > 0);
  for (const spark of game.sparks) {
    spark.x += spark.dx * dt;
    spark.y += spark.dy * dt;
    spark.ttl -= dt;
  }
  game.sparks = game.sparks.filter(spark => spark.ttl > 0);
}

const pixels = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.round(WIDTH * pixels);
canvas.height = Math.round(HEIGHT * pixels);
pen.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
const grid = document.createElement('canvas');
grid.width = canvas.width;
grid.height = canvas.height;
const gridPen = grid.getContext('2d');
gridPen.setTransform(grid.width / WIDTH, 0, 0, grid.height / HEIGHT, 0, 0);

function segment(context, fromX, fromY, toX, toY) {
  context.beginPath();
  context.moveTo(fromX, fromY);
  context.lineTo(toX, toY);
  context.stroke();
}

function circle(context, x, y, radius) {
  context.beginPath();
  context.arc(x, y, radius, 0, FULL_TURN);
}

function polygon(context, points) {
  context.beginPath();
  points.forEach(([x, y], index) => index === 0 ? context.moveTo(x, y) : context.lineTo(x, y));
  context.closePath();
}

function hexagon(radius, angle) {
  return Array.from({length: 6}, (_, index) => {
    const direction = angle + index * FULL_TURN / 6;
    return [Math.cos(direction) * radius, Math.sin(direction) * radius];
  });
}

function drawRadarGrid() {
  const context = gridPen;
  const {x, y} = CENTER;
  const light = context.createRadialGradient(x, y, 8, x, y, 190);
  light.addColorStop(0, '#2f898c36');
  light.addColorStop(.68, '#325f6830');
  light.addColorStop(1, '#21445000');
  context.fillStyle = light;
  context.fillRect(0, 0, WIDTH, HEIGHT);
  context.strokeStyle = '#8bd9e515';
  context.lineWidth = 1;
  for (let dx = -220; dx <= 220; dx += 20) segment(context, x + dx, 49, x + dx, 371);
  for (let dy = -160; dy <= 160; dy += 20) segment(context, 20, y + dy, 460, y + dy);
  context.strokeStyle = '#6abcb62a';
  segment(context, x, 38, x, HEIGHT - 38);
  segment(context, 24, y, WIDTH - 24, y);
  context.setLineDash([2, 7]);
  circle(context, x, y, 172);
  context.stroke();
  context.setLineDash([]);
  context.strokeStyle = '#78baba45';
  for (let mark = 0; mark < 72; mark++) {
    const direction = mark * FULL_TURN / 72;
    const inner = port(mark % 6 === 0 ? 152 : 156, direction);
    const outer = port(160, direction);
    segment(context, inner.x, inner.y, outer.x, outer.y);
  }
  context.strokeStyle = '#84d8db45';
  [[58, 58, 1, 1], [422, 58, -1, 1], [58, 362, 1, -1], [422, 362, -1, -1]].forEach(([left, top, dx, dy]) => {
    context.beginPath();
    context.moveTo(left, top + dy * 16);
    context.lineTo(left, top);
    context.lineTo(left + dx * 16, top);
    context.stroke();
  });
}

function drawTrack(radius, active, color) {
  const {x, y} = CENTER;
  pen.lineWidth = 1;
  pen.strokeStyle = active ? color + '30' : '#95dce52a';
  for (const offset of [-5, 5]) {
    circle(pen, x, y, radius + offset);
    pen.stroke();
  }
  pen.setLineDash(active ? [] : [4, 5]);
  pen.strokeStyle = active ? color + '88' : '#8bd8de69';
  circle(pen, x, y, radius);
  pen.stroke();
  pen.setLineDash([]);

  const gate = port(radius, START_ANGLE);
  pen.strokeStyle = active ? color : '#83dfec84';
  pen.fillStyle = active ? color + '36' : '#132932';
  polygon(pen, [[gate.x - 4, gate.y], [gate.x, gate.y - 4], [gate.x + 4, gate.y], [gate.x, gate.y + 4]]);
  pen.stroke();
  pen.fill();
  for (const angle of [0, Math.PI / 2, Math.PI]) {
    const point = port(radius, angle);
    pen.fillRect(point.x - 2, point.y - 2, 4, 4);
  }
}

function drawCore(time) {
  pen.save();
  pen.translate(CENTER.x, CENTER.y);
  const color = game.coreFlash > 0 ? '#ff848d' : game.stage.tint;
  const glow = pen.createRadialGradient(0, 0, 0, 0, 0, 68);
  glow.addColorStop(0, color + '83');
  glow.addColorStop(.45, color + '2c');
  glow.addColorStop(1, color + '00');
  pen.fillStyle = glow;
  circle(pen, 0, 0, 68);
  pen.fill();

  for (let index = 0; index < 4; index++) {
    const angle = index * Math.PI / 2 + time * .23;
    pen.beginPath();
    pen.arc(0, 0, 43, angle, angle + .63);
    pen.lineWidth = 2;
    pen.strokeStyle = color + 'a3';
    pen.stroke();
  }
  pen.fillStyle = '#0d222a';
  pen.strokeStyle = color;
  pen.lineWidth = 1.5;
  polygon(pen, hexagon(30, Math.PI / 6));
  pen.fill();
  pen.stroke();
  pen.strokeStyle = color + '65';
  polygon(pen, hexagon(22, Math.PI / 6));
  pen.stroke();
  pen.rotate(time * .45);
  pen.shadowColor = color;
  pen.shadowBlur = 16;
  pen.strokeStyle = color;
  pen.fillStyle = color + '63';
  polygon(pen, [[0, -14], [11, 0], [0, 14], [-11, 0]]);
  pen.fill();
  pen.stroke();
  pen.fillStyle = '#e1fff1';
  circle(pen, 0, 0, 3);
  pen.fill();
  pen.restore();
}

function drawShip(time) {
  const active = game.orbit === 'outer';
  const color = active ? '#dfff80' : '#83dfec';
  const angle = game.mode === 'ready' ? START_ANGLE + time * .33 + .42 : game.angle;
  const ship = port(game.radius, angle);
  pen.lineCap = 'round';
  for (let index = 0; index < 7; index++) {
    const fade = Math.round((190 - index * 26)).toString(16).padStart(2, '0');
    pen.strokeStyle = color + fade;
    pen.lineWidth = 3 - index * .28;
    pen.beginPath();
    pen.arc(CENTER.x, CENTER.y, game.radius, angle - (index + 1) * .091, angle - index * .091);
    pen.stroke();
  }
  pen.save();
  pen.translate(ship.x, ship.y);
  pen.rotate(angle + Math.PI / 2);
  pen.shadowColor = color;
  pen.shadowBlur = 18;
  pen.fillStyle = color;
  pen.strokeStyle = '#f7ffd9';
  pen.lineWidth = 1;
  polygon(pen, [[16, 0], [-10, -10], [-6, 0], [-10, 10]]);
  pen.fill();
  pen.stroke();
  pen.shadowBlur = 0;
  pen.fillStyle = '#40634f';
  polygon(pen, [[7, 0], [-5, -3], [-4, 3]]);
  pen.fill();
  pen.restore();
}

function drawEnemy(enemy, time) {
  const {x, y, size, kind} = enemy;
  const chilled = enemy.slow > 0;
  const color = enemy.flash > 0 ? (enemy.hitColor ?? '#fff0ea') : chilled ? '#91e8ff' : kind === 'boss' ? game.stage.bossColor : ENEMY[kind].color;
  pen.save();
  pen.translate(x, y);
  pen.rotate(enemy.angle + Math.PI);
  pen.lineWidth = 1.4;
  pen.strokeStyle = color;
  pen.fillStyle = kind === 'boss' ? '#572135' : '#2c1b2b';
  pen.shadowColor = color;
  pen.shadowBlur = kind === 'boss' ? 16 : 7;
  if (kind === 'seeker') polygon(pen, [[size, 0], [0, -size], [-size, -size * .5], [-size, size * .5], [0, size]]);
  else if (kind === 'dart') polygon(pen, [[size * 1.35, 0], [-size, -size * .8], [-size * .4, 0], [-size, size * .8]]);
  else if (kind === 'armor') polygon(pen, hexagon(size, 0));
  else if (kind === 'gunner') polygon(pen, [[size * 1.2, 0], [size * .5, -size * .5], [0, -size],
    [-size, -size], [-size, size], [0, size], [size * .5, size * .5]]);
  else if (kind === 'escort' || kind === 'cargo') drawOuterEnemyShape(enemy);
  else if (kind === 'splitter' || kind === 'breacher') drawFinaleEnemyShape(enemy);
  else polygon(pen, [[size * 1.15, 0], [size * .67, -size * .78], [-size * .45, -size],
    [-size, -size * .45], [-size * .5, 0], [-size, size * .45], [-size * .45, size], [size * .67, size * .78]]);
  pen.fill();
  pen.stroke();
  pen.shadowBlur = 0;
  if (enemy.plated) {
    pen.strokeStyle = '#ffd7ef';
    polygon(pen, hexagon(size * .66, 0));
    pen.stroke();
  }
  if (enemy.dashing) {
    pen.strokeStyle = '#ffc996b8';
    for (const side of [-1, 1]) {
      segment(pen, -size * .9, side * size * .38, -size * 2.7, side * size * .60);
    }
  }
  pen.fillStyle = color;
  circle(pen, 1, 0, kind === 'boss' ? 5 : 2);
  pen.fill();
  if (kind === 'boss') {
    pen.rotate(-enemy.angle - Math.PI);
    pen.strokeStyle = game.stage.bossColor + '70';
    pen.setLineDash([8, 6]);
    pen.beginPath();
    pen.arc(0, 0, 34, time, time + FULL_TURN);
    pen.stroke();
  }
  pen.restore();
  if (enemy.shield > 0) {
    pen.save();
    pen.translate(x, y);
    pen.fillStyle = '#9d6be22a';
    pen.strokeStyle = SHIELD_COLOR;
    pen.lineWidth = 1.8;
    polygon(pen, hexagon(size + 12, time * .4));
    pen.fill();
    pen.stroke();
    pen.restore();
  }
  if (enemy.stop > 0) {
    pen.save();
    pen.translate(x, y);
    pen.fillStyle = '#85e7ff30';
    pen.strokeStyle = '#d1f7ffda';
    pen.lineWidth = 1.2;
    polygon(pen, hexagon(size + 5, Math.PI / 6));
    pen.fill();
    pen.stroke();
    pen.restore();
  }
  if (enemy.health < enemy.maxHealth || kind === 'boss') {
    const width = size * 1.95;
    pen.fillStyle = '#321d2c';
    pen.fillRect(x - width / 2, y - size - 7, width, 3);
    pen.fillStyle = color;
    pen.fillRect(x - width / 2, y - size - 7, width * Math.max(0, enemy.health / enemy.maxHealth), 3);
    if (enemy.shield > 0) {
      pen.fillStyle = '#432454';
      pen.fillRect(x - width / 2, y - size - 13, width, 3);
      pen.fillStyle = SHIELD_COLOR;
      pen.fillRect(x - width / 2, y - size - 13, width * enemy.shield / game.stage.shield, 3);
    }
  }
}

function trace(points) {
  pen.beginPath();
  pen.moveTo(points[0].x, points[0].y);
  for (const {x, y} of points.slice(1)) pen.lineTo(x, y);
}

function drawPulse(shot, elapsed) {
  const {from, to, tier, travel} = shot;
  const progress = Math.min(elapsed / travel, 1);
  const x = from.x + (to.x - from.x) * progress;
  const y = from.y + (to.y - from.y) * progress;
  if (elapsed < travel) {
    pen.translate(x, y);
    pen.rotate(Math.atan2(to.y - from.y, to.x - from.x));
    const tail = Math.min(22 + tier * 5, distance(from, {x, y}) + 3);
    pen.strokeStyle = '#dafa72';
    pen.shadowColor = '#c7f443';
    pen.shadowBlur = 11;
    pen.lineWidth = 2 + tier * .38;
    segment(pen, -tail, 0, 1, 0);
    pen.fillStyle = '#f6ffd3';
    polygon(pen, [[7 + tier, 0], [0, 2.6], [-6, 0], [0, -2.6]]);
    pen.fill();
    return;
  }
  const flash = (elapsed - travel) / (shot.life - travel);
  pen.globalAlpha = 1 - flash;
  pen.translate(to.x, to.y);
  pen.rotate(Math.atan2(to.y - from.y, to.x - from.x));
  pen.strokeStyle = '#edffa1';
  pen.lineWidth = 1.1;
  const size = 4 + flash * (12 + tier * 2);
  segment(pen, -size, 0, size, 0);
  segment(pen, 0, -size * .65, 0, size * .65);
}

function drawFrost(effect, elapsed) {
  const {from, to, tier, size, travel} = effect;
  if (elapsed < travel) {
    const k = elapsed / travel;
    pen.translate(from.x + (to.x - from.x) * k, from.y + (to.y - from.y) * k);
    pen.rotate(elapsed * 13);
    pen.fillStyle = '#c5f8ff';
    pen.shadowColor = '#6edfff';
    pen.shadowBlur = 15;
    polygon(pen, hexagon(5 + tier, 0));
    pen.fill();
    return;
  }
  const progress = (elapsed - travel) / (effect.life - travel);
  const radius = size * (.08 + .92 * (1 - (1 - Math.min(1, progress * 2)) ** 3));
  pen.translate(to.x, to.y);
  pen.globalAlpha = Math.min(.93, (1 - progress) * 1.35);
  pen.fillStyle = '#69d6fd29';
  pen.strokeStyle = '#a2eeffbf';
  pen.lineWidth = 1.5 + tier * .23;
  circle(pen, 0, 0, radius);
  pen.fill();
  pen.stroke();
  pen.strokeStyle = '#b8f7ff';
  polygon(pen, hexagon(radius * .72, elapsed * .55));
  pen.stroke();
  for (let spoke = 0; spoke < 6; spoke++) {
    const angle = spoke * FULL_TURN / 6 - Math.PI / 2;
    const dx = Math.cos(angle), dy = Math.sin(angle);
    segment(pen, dx * radius * .33, dy * radius * .33, dx * radius * .81, dy * radius * .81);
    for (const sign of [-1, 1]) {
      const edge = angle + sign * .62;
      segment(pen, dx * radius * .65, dy * radius * .65,
        dx * radius * .65 - Math.cos(edge) * radius * .19, dy * radius * .65 - Math.sin(edge) * radius * .19);
    }
  }
}

function drawArc(effect) {
  pen.globalAlpha = Math.min(1, effect.ttl / effect.life * 1.6);
  pen.shadowColor = '#b279f1';
  pen.shadowBlur = 12;
  pen.strokeStyle = '#ab78f5';
  pen.lineWidth = 4 + effect.tier * .8;
  trace(effect.points);
  pen.stroke();
  pen.shadowBlur = 0;
  pen.strokeStyle = '#f9e4ff';
  pen.lineWidth = 1 + effect.tier * .24;
  pen.stroke();
  pen.strokeStyle = '#d4a4ff';
  pen.lineWidth = 1;
  for (const branch of effect.branches) {
    trace(branch);
    pen.stroke();
  }
}

function drawEffects() {
  for (const effect of game.effects) {
    pen.save();
    const elapsed = effect.life - effect.ttl;
    if (effect.kind === 'pulse') drawPulse(effect, elapsed);
    else if (effect.kind === 'frost') drawFrost(effect, elapsed);
    else if (effect.kind === 'arc') drawArc(effect);
    else if (effect.kind === 'ripple') {
      pen.globalAlpha = Math.min(1, effect.ttl / effect.life);
      pen.strokeStyle = effect.color;
      pen.shadowColor = effect.color;
      pen.shadowBlur = 10;
      pen.lineWidth = 2;
      circle(pen, effect.x, effect.y, Math.max(3, elapsed / effect.life * effect.size));
      pen.stroke();
    } else drawExpansionEffect(effect, elapsed);
    pen.restore();
  }
  pen.save();
  for (const spark of game.sparks) {
    pen.globalAlpha = spark.ttl / spark.life;
    pen.fillStyle = spark.color;
    pen.fillRect(spark.x, spark.y, spark.size, spark.size);
  }
  pen.restore();
}

function render(time) {
  pen.clearRect(0, 0, WIDTH, HEIGHT);
  pen.drawImage(grid, 0, 0, WIDTH, HEIGHT);
  drawFormation();
  drawTrack(ORBITS.outer, game.orbit === 'outer', '#dfff80');
  drawTrack(ORBITS.inner, game.orbit === 'inner', '#83dfec');
  if (game.mode !== 'ready' && game.innerTravel > 0) {
    pen.lineWidth = 2;
    pen.strokeStyle = '#83dfecce';
    pen.beginPath();
    pen.arc(CENTER.x, CENTER.y, ORBITS.inner - 9, START_ANGLE,
      START_ANGLE + Math.min(game.innerTravel * 2, FULL_TURN));
    pen.stroke();
  }
  const lockedOrbit = game.enemies.find(enemy => enemy.kind === 'boss')?.lockedOrbit;
  if (lockedOrbit) {
    pen.save();
    pen.setLineDash([7, 5]);
    pen.globalAlpha = .6 + Math.sin(time * 18) * .3;
    pen.lineWidth = 13;
    pen.strokeStyle = '#e6537770';
    circle(pen, CENTER.x, CENTER.y, ORBITS[lockedOrbit]);
    pen.stroke();
    pen.lineWidth = 2;
    pen.strokeStyle = '#ffa4b4';
    pen.stroke();
    pen.restore();
  }
  drawCore(time);
  drawOuterGuides();
  drawFinaleGuides(time);
  for (const enemy of game.enemies) drawEnemy(enemy, time);
  drawExpansionObjects(time);
  drawMines();
  drawEffects();
  drawShip(time);
}

let previous = 0;
let nextHud = 0;
function frame(stamp) {
  const dt = Math.min(.05, previous ? (stamp - previous) / 1000 : 0);
  previous = stamp;
  if (screen === 'battle' && game.mode === 'playing') {
    advance(dt);
    if (stamp >= nextHud) {
      nextHud = stamp + 100;
      syncHud();
    }
  }
  if (screen === 'battle') render(game.mode === 'ready' ? stamp / 1000 : game.time);
  requestAnimationFrame(frame);
}
