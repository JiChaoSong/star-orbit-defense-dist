function otherOrbit(orbit) {
  return orbit === 'outer' ? 'inner' : 'outer';
}

const CORRIDOR_ANGLE = -.18;
const FLANK_ANGLES = [-.34, Math.PI + .24];

function formationAngle(formation, index, wave) {
  const variation = Math.random() - .5;
  if (formation === 'corridor') return CORRIDOR_ANGLE + Math.PI * (Math.floor(index / 3) % 2) + variation * .13;
  if (formation === 'split') return .26 + (index % 4) * Math.PI / 2 + wave * .13 + variation * .49;
  if (formation === 'flanks') return FLANK_ANGLES[Math.floor(index / 4) % 2] + variation * .52;
  return game.lastSpawnAngle + 2.399963 + variation * .46;
}

function launchSpecial(item, origin, target) {
  const spec = GEAR[item.kind];
  const {tier} = item;
  if (item.kind === 'blade') {
    const angle = Math.atan2(target.y - origin.y, target.x - origin.x);
    game.blades.push({
      origin: {...origin}, angle, tier, orbit: game.orbit, reach: spec.range + 16,
      width: [9, 15, 19][tier - 1], damage: spec.damage[tier - 1],
      age: 0, duration: .78, hits: [new Set(), new Set()], echoHits: new Set(),
    });
  } else {
    const well = {
      x: target.x, y: target.y, duration: tier === 3 ? 1.36 : .98,
      age: 0, radius: [66, 85, 100][tier - 1], strength: [100, 137, 155][tier - 1], bonus: tier === 3 ? 1.68 : 1.44,
    };
    game.wells.push(well);
    for (const enemy of game.enemies) {
      if (enemy.dead || distance(well, enemy) > well.radius * .72) continue;
      enemy.hitColor = spec.color;
      strike(enemy, spec.damage[tier - 1] * (enemy === target ? 1 : .52));
    }
  }
  recoverWeapon(item);
}

function gravityBonus(enemy) {
  let bonus = 1;
  for (const well of game.wells) {
    if (distance(well, enemy) <= well.radius) bonus = Math.max(bonus, well.bonus);
  }
  return bonus;
}

function bladePosition(blade, age, echo = false) {
  const phase = age / blade.duration * 2;
  const distance = blade.reach * (phase <= 1 ? phase : 2 - phase);
  const curve = Math.sin(Math.PI * distance / blade.reach) * (echo ? -35 : 12);
  return {
    x: blade.origin.x + Math.cos(blade.angle) * distance - Math.sin(blade.angle) * curve,
    y: blade.origin.y + Math.sin(blade.angle) * distance + Math.cos(blade.angle) * curve,
  };
}

function distanceToSegment(point, from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const lengthSquared = dx * dx + dy * dy;
  if (lengthSquared < .0001) return distance(point, from);
  const fraction = ((point.x - from.x) * dx + (point.y - from.y) * dy) / lengthSquared;
  const along = Math.max(0, Math.min(1, fraction));
  return Math.hypot(point.x - from.x - along * dx, point.y - from.y - along * dy);
}

function sweepBlade(blade, start, end, returnPass, echo = false) {
  const from = bladePosition(blade, start, echo);
  const to = bladePosition(blade, end, echo);
  const hit = echo ? blade.echoHits : blade.hits[Number(returnPass)];
  for (const enemy of game.enemies) {
    if (enemy.dead || hit.has(enemy) || distanceToSegment(enemy, from, to) > blade.width + enemy.size * .65) continue;
    hit.add(enemy);
    enemy.hitColor = GEAR.blade.color;
    strike(enemy, blade.damage * (echo ? .54 : returnPass ? .78 : 1), blade.orbit);
  }
}

function advanceSpecialWeapons(dt) {
  for (const blade of game.blades) {
    const middle = blade.duration / 2;
    const end = Math.min(blade.duration, blade.age + dt);
    if (blade.age < middle) sweepBlade(blade, blade.age, Math.min(end, middle), false);
    if (end > middle) {
      const start = Math.max(blade.age, middle);
      sweepBlade(blade, start, end, true);
      if (blade.tier === 3) sweepBlade(blade, start, end, true, true);
    }
    blade.age = end;
  }
  game.blades = game.blades.filter(blade => blade.age < blade.duration);

  for (const well of game.wells) {
    well.age += dt;
    for (const enemy of game.enemies) {
      if (enemy.dead || (enemy.kind !== 'seeker' && enemy.kind !== 'dart')) continue;
      const gap = distance(well, enemy);
      if (gap < 9 || gap > well.radius) continue;
      const pull = Math.min(gap - 8, well.strength * dt * (.48 + .52 * gap / well.radius));
      enemy.x += (well.x - enemy.x) / gap * pull;
      enemy.y += (well.y - enemy.y) / gap * pull;
      enemy.angle = Math.atan2(enemy.y - CENTER.y, enemy.x - CENTER.x);
    }
  }
  game.wells = game.wells.filter(well => well.age < well.duration);
  updateSentry(dt);
}

function equippedTier(kind) {
  let tier = 0;
  for (const item of game.kit) {
    if (item?.kind === kind) tier = Math.max(tier, item.tier);
  }
  return tier;
}

function activateSwitchGear(previous) {
  const sentry = equippedTier('sentry');
  const radius = ORBITS[previous];
  if (sentry && game.time >= game.sentryReadyAt) {
    game.sentry = { ...port(radius, game.angle), tier: sentry, orbit: previous,
      life: [3.2, 3.8, 4.35][sentry - 1], readyIn: 0 };
    game.sentryReadyAt = game.time + 4.65;
    ripple(game.sentry, 34, GEAR.sentry.color);
    announce('哨戒浮游炮已部署在原轨。', 1.7);
    playShot('sentry');
  }

  const resonance = equippedTier('resonator');
  if (!resonance || game.railHeld < RESONANCE_CHARGE || game.time < game.resonatorReadyAt) return;
  game.resonatorReadyAt = game.time + 3.2;
  dischargeResonance(previous, radius, resonance);
  if (resonance === 3) dischargeResonance(game.orbit, ORBITS[game.orbit], resonance, .6);
  announce('轨道共振已释放。', 1.7);
  playShot('resonator');
}

function dischargeResonance(orbit, radius, tier, multiplier = 1) {
  const width = [30, 42, 46][tier - 1];
  const color = GEAR.resonator.color;
  game.effects.push({kind: 'resonance', radius, width, color, ttl: .52, life: .52});
  for (const enemy of game.enemies) {
    if (enemy.dead) continue;
    const disruptsBoss = enemy.kind === 'boss' && enemy.lockedOrbit === orbit;
    if (!disruptsBoss && Math.abs(distance(CENTER, enemy) - radius) > width + enemy.size * .25) continue;
    enemy.hitColor = color;
    strike(enemy, GEAR.resonator.damage[tier - 1] * multiplier * (disruptsBoss ? 1.3 : 1), orbit);
  }
}

function updateSentry(dt) {
  const turret = game.sentry;
  if (!turret) return;
  turret.life -= dt;
  if (turret.life <= 0) {
    game.sentry = null;
    return;
  }
  turret.readyIn -= dt;
  if (turret.readyIn > 0) return;
  const spec = GEAR.sentry;
  const target = closest(turret, spec.range, game.enemies);
  if (!target) return;
  shootSentry(turret, target, spec.damage[turret.tier - 1]);
  if (turret.tier === 3) {
    const second = closest(turret, spec.range, game.enemies.filter(enemy => enemy !== target));
    if (second) shootSentry(turret, second, spec.damage[2] * .70);
  }
  turret.readyIn = .43;
  playShot('sentry');
}

function shootSentry(turret, enemy, damage) {
  turret.angle = Math.atan2(enemy.y - turret.y, enemy.x - turret.x);
  const color = GEAR.sentry.color;
  supportBeam(turret, enemy, color, 'turret');
  enemy.hitColor = color;
  strike(enemy, damage, turret.orbit);
}

function supportBeam(from, to, color, kind) {
  game.effects.push({kind, from: {x: from.x, y: from.y}, to: {x: to.x, y: to.y},
    color, ttl: .22, life: .22});
}

function updateGunner(enemy, dt) {
  if (enemy.shots >= 2) return false;
  if (enemy.stop > 0) return true;
  enemy.launchIn -= dt * (enemy.slow > 0 ? .65 : 1);
  if (enemy.launchIn > 0) return true;
  enemy.launchIn = 1.72;
  enemy.shots++;
  launchMissile(enemy);
  return true;
}

function launchMissile(enemy) {
  const angle = Math.atan2(CENTER.y - enemy.y, CENTER.x - enemy.x);
  game.missiles.push({x: enemy.x, y: enemy.y, angle, source: enemy, dead: false});
  ripple(enemy, 17, '#ffb98e');
}

function interceptMissiles(item, origin) {
  const spec = GEAR.deflector;
  const threatened = game.missiles.filter(missile => !missile.dead && distance(origin, missile) <= spec.range);
  threatened.sort((a, b) => distance(CENTER, a) - distance(CENTER, b));
  const targets = threatened.slice(0, item.tier);
  if (!targets.length) return;
  for (const target of targets) {
    target.dead = true;
    supportBeam(origin, target, spec.color, 'intercept');
    ripple(target, 27, spec.color);
    if (target.source && !target.source.dead) {
      supportBeam(target, target.source, spec.color, 'intercept');
      target.source.hitColor = spec.color;
      strike(target.source, spec.damage[item.tier - 1]);
    }
  }
  recoverWeapon(item);
}

function advanceMissiles(dt) {
  for (const missile of game.missiles) {
    if (missile.dead) continue;
    const gap = distance(CENTER, missile);
    if (gap < 21) {
      missile.dead = true;
      game.hp = Math.max(0, game.hp - 10);
      game.coreFlash = .43;
      splash(missile, 11, '#ffb98e', 9);
      ripple(CENTER, 38, '#ffb98e');
      if (game.hp === 0) {
        endGame(false, '炮艇飞弹击毁了核心');
        return;
      }
      continue;
    }
    const travel = Math.min(gap, dt * 91);
    missile.x += Math.cos(missile.angle) * travel;
    missile.y += Math.sin(missile.angle) * travel;
  }
  game.missiles = game.missiles.filter(missile => !missile.dead);
}

function drawFormation() {
  const {formation, tint} = game.stage;
  if (!formation) return;
  pen.save();
  pen.strokeStyle = tint + '49';
  pen.lineWidth = 1.2;
  pen.setLineDash([6, 8]);
  const directions = formation === 'corridor' ? [CORRIDOR_ANGLE, CORRIDOR_ANGLE + Math.PI] :
    formation === 'flanks' ? FLANK_ANGLES : Array.from({length: 4}, (_, index) =>
      .26 + index * Math.PI / 2 + game.wave * .13);
  for (const angle of directions) {
    const inside = port(formation === 'corridor' ? 145 : 163, angle);
    const outside = port(275, angle);
    segment(pen, inside.x, inside.y, outside.x, outside.y);
  }
  pen.restore();
}

function drawBlade(blade, echo = false) {
  const point = bladePosition(blade, blade.age, echo);
  const tail = bladePosition(blade, Math.max(0, blade.age - .075), echo);
  pen.save();
  pen.strokeStyle = echo ? '#ffe0a475' : '#ffbc69aa';
  pen.lineWidth = echo ? 2 : 4;
  segment(pen, tail.x, tail.y, point.x, point.y);
  pen.translate(point.x, point.y);
  pen.rotate(blade.age * 22);
  pen.fillStyle = echo ? '#ffce9fa9' : '#ffdfaa';
  const size = (echo ? .7 : 1) * (9 + blade.tier * 1.7);
  polygon(pen, [[size, -size], [size * .6, 0], [size, size], [-size, size * .43], [-size * .25, 0], [-size, -size * .43]]);
  pen.fill();
  pen.restore();
}

function drawWell(well, time) {
  pen.save();
  pen.translate(well.x, well.y);
  pen.globalAlpha = Math.min(1, (well.duration - well.age) * 3);
  pen.strokeStyle = '#f4a7df9e';
  pen.fillStyle = '#bd69c130';
  pen.lineWidth = 1.45;
  circle(pen, 0, 0, well.radius);
  pen.fill();
  pen.stroke();
  for (let ring = 0; ring < 3; ring++) {
    const turn = time * 4 + ring * 2.1;
    pen.strokeStyle = ring ? '#f4a7df84' : '#ffe3fc';
    pen.beginPath();
    pen.arc(0, 0, well.radius * (.25 + ring * .22), turn, turn + 2.4);
    pen.stroke();
  }
  pen.restore();
}

function drawExpansionObjects(time) {
  for (const well of game.wells) drawWell(well, time);
  for (const blade of game.blades) {
    drawBlade(blade);
    if (blade.tier === 3 && blade.age >= blade.duration / 2) drawBlade(blade, true);
  }
  const turret = game.sentry;
  if (turret) {
    pen.save();
    pen.translate(turret.x, turret.y);
    pen.rotate(turret.angle ?? 0);
    pen.fillStyle = '#184638';
    pen.strokeStyle = GEAR.sentry.color;
    pen.lineWidth = 1.5;
    polygon(pen, hexagon(8.5, 0));
    pen.fill();
    pen.stroke();
    pen.fillStyle = GEAR.sentry.color;
    pen.fillRect(2, -2, 11, 4);
    pen.restore();
  }
  for (const missile of game.missiles) {
    pen.save();
    pen.translate(missile.x, missile.y);
    pen.rotate(missile.angle);
    pen.strokeStyle = '#ff9f78';
    pen.lineWidth = 2.5;
    segment(pen, -13, 0, 0, 0);
    pen.fillStyle = '#fff1c8';
    polygon(pen, [[5.5, 0], [-4, -3.5], [-4, 3.5]]);
    pen.fill();
    pen.restore();
  }
}

function drawExpansionEffect(effect, elapsed) {
  const remaining = effect.ttl / effect.life;
  if (effect.kind === 'resonance') {
    pen.strokeStyle = effect.color;
    pen.globalAlpha = remaining * .32;
    pen.lineWidth = effect.width * (1 - remaining) + 1;
    circle(pen, CENTER.x, CENTER.y, effect.radius);
    pen.stroke();
    pen.globalAlpha = remaining;
    pen.lineWidth = 1.65;
    circle(pen, CENTER.x, CENTER.y, effect.radius + effect.width * elapsed / effect.life * .58);
    pen.stroke();
    return;
  }
  pen.strokeStyle = effect.color;
  pen.globalAlpha = remaining;
  pen.lineWidth = effect.kind === 'intercept' ? 2 : 2.8;
  if (effect.kind === 'intercept') pen.setLineDash([5, 4]);
  segment(pen, effect.from.x, effect.from.y, effect.to.x, effect.to.y);
  if (effect.kind === 'intercept') {
    pen.setLineDash([]);
    pen.lineWidth = 1;
    circle(pen, effect.to.x, effect.to.y, 6 + elapsed * 45);
    pen.stroke();
  }
}

const ESCORT_RANGE = 86;
const SKIRT_RADIUS = ORBITS.outer + 11;
const SKIRT_SWEEP = .66;

function escortEntryAngle(encounter, index, wave) {
  const lead = encounter.escortsAt?.find(first => first <= index && index < first + 3);
  if (lead === undefined) return undefined;
  return (wave + 1) * 1.05 + lead * 2.4 + (index - lead) * .09 + (Math.random() - .5) * .08;
}

function activeEscort(enemy) {
  const escort = enemy.protector;
  return escort && !escort.dead && (escort.disruptedUntil ?? 0) <= game.time &&
    distance(enemy, escort) <= ESCORT_RANGE ? escort : null;
}

function updateEscortLinks() {
  for (const enemy of game.enemies) enemy.protector = null;
  for (const escort of game.enemies) {
    if (escort.dead || escort.kind !== 'escort' || (escort.disruptedUntil ?? 0) > game.time) continue;
    const candidates = game.enemies.filter(enemy => !enemy.dead && enemy.kind !== 'escort' &&
      !enemy.protector && distance(enemy, escort) <= ESCORT_RANGE);
    candidates.sort((a, b) => {
      if (a === escort.leader) return -1;
      if (b === escort.leader) return 1;
      return distance(a, escort) - distance(b, escort);
    });
    for (const enemy of candidates.slice(0, 2)) enemy.protector = escort;
  }
}

function summonEscort(boss) {
  const angle = Math.atan2(boss.y - CENTER.y, boss.x - CENTER.x) + .17;
  const escort = addEnemy('escort', angle, distance(CENTER, boss) + 27);
  escort.speed = boss.speed * 1.06;
  escort.leader = boss;
  ripple(escort, 29, '#ffd097');
  announce('首领呼叫护航舰。沿金色光束找到它。', 2.8);
  return escort;
}

function updateOuterBoss(boss, dt) {
  if (!game.stage.relayBoss) {
    if (game.stage.escortAtHealth && !boss.summonedEscort && boss.health <= boss.maxHealth * game.stage.escortAtHealth) {
      boss.summonedEscort = summonEscort(boss);
    }
    updateBossPulse(boss, dt);
    return;
  }

  if (boss.relayPhase === 'recovery') {
    if (callSiegeReinforcement(boss)) return;
    if (game.time >= boss.relayAt) {
      boss.summonedEscort = summonEscort(boss);
      boss.relayPhase = 'escort';
      boss.relayAt = game.time + 3.65;
    }
    return;
  }
  if (boss.relayPhase === 'escort') {
    if (!boss.summonedEscort.dead && game.time < boss.relayAt) return;
    if (!boss.summonedEscort.dead) {
      boss.summonedEscort.dead = true;
      ripple(boss.summonedEscort, 26, '#ffd097');
    }
    boss.relayPhase = 'pulse';
    boss.pulseTimer = .65;
  }

  const warned = Boolean(boss.lockedOrbit);
  updateBossPulse(boss, dt);
  if (warned && !boss.lockedOrbit) {
    boss.relayPhase = 'recovery';
    boss.relayAt = game.time + 1.75;
  }
}

function activateOuterWeapon(item, origin) {
  if (item.kind === 'mine') {
    if (!game.enemies.some(enemy => !enemy.dead) || game.mines.length >= 2) return;
    game.mines.push({...origin, tier: item.tier, orbit: game.orbit, age: 0});
  } else {
    const spec = GEAR.disruptor;
    const guards = game.enemies.filter(enemy => enemy.kind === 'escort');
    const guard = closest(origin, spec.range, guards);
    const target = guard ?? closest(origin, spec.range, game.enemies);
    if (!target) return;
    interruptEscort(item, origin, target);
    if (guard && item.tier === 3) {
      const nearby = closest(guard, 105, guards.filter(enemy => enemy !== guard));
      if (nearby) interruptEscort(item, guard, nearby, .65);
    }
  }
  recoverWeapon(item);
}

function interruptEscort(item, origin, target, multiplier = 1) {
  const spec = GEAR.disruptor;
  if (target.kind === 'escort') {
    const online = (target.disruptedUntil ?? 0) <= game.time;
    target.disruptedUntil = game.time + (item.tier === 1 ? 2 : 3);
    if (online) {
      ripple(target, 32, spec.color);
      announce('护航链已断开。', 1.3);
    }
  }
  supportBeam(origin, target, spec.color, 'intercept');
  target.hitColor = spec.color;
  strike(target, spec.damage[item.tier - 1] * multiplier);
}

function advanceSkirting(enemy, radius, dt) {
  if (radius > SKIRT_RADIUS) return false;
  enemy.skirtRemaining ??= SKIRT_SWEEP;
  if (enemy.skirtRemaining <= 0) return false;
  const factor = enemy.stop > 0 ? 0 : enemy.slow > 0 ? .65 : 1;
  const distance = Math.min(enemy.skirtRemaining, dt * 1.2 * factor);
  enemy.skirtRemaining -= distance;
  enemy.angle = Math.atan2(enemy.y - CENTER.y, enemy.x - CENTER.x) + distance * enemy.skirtDirection;
  Object.assign(enemy, port(radius, enemy.angle));
  if (enemy.skirtRemaining <= 0) enemy.skirtDirection = 0;
  return true;
}

function advanceMines(dt) {
  for (const mine of game.mines) {
    mine.age += dt;
    if (mine.age < .4 || mine.age >= 5.4) continue;
    const reach = [25, 31, 36][mine.tier - 1];
    const trigger = game.enemies.some(enemy => !enemy.dead && distance(enemy, mine) <= reach + enemy.size * .7);
    if (!trigger) continue;
    const radius = [46, 61, 76][mine.tier - 1];
    const {color, damage} = GEAR.mine;
    for (const enemy of game.enemies) {
      if (enemy.dead || distance(enemy, mine) > radius) continue;
      enemy.hitColor = color;
      strike(enemy, damage[mine.tier - 1], mine.orbit);
    }
    mine.age = 5.4;
    ripple(mine, radius, color);
    splash(mine, 32, color, 14);
    notes([180, 100], 'triangle', .055);
  }
  if (game.mines.length) game.mines = game.mines.filter(mine => mine.age < 5.4);
}

function advanceCargo(enemy, dt) {
  if (enemy.stop > 0) return;
  const travel = dt * (enemy.slow > 0 ? .65 : 1);
  enemy.cargoAge += travel;
  if (enemy.cargoAge >= 5.3) {
    enemy.dead = true;
    return;
  }
  enemy.angle += enemy.cargoDirection * travel * .54;
  const radius = ORBITS.outer + 24 + Math.max(0, enemy.cargoAge - 2.8) * 43;
  Object.assign(enemy, port(radius, enemy.angle));
}

function reclaimSalvage() {
  const tier = equippedTier('recycler');
  if (!tier || game.reclaimed >= tier + 1) return;
  game.reclaimed++;
  game.scrap++;
  const ship = port(game.radius, game.angle);
  ripple(ship, 21, GEAR.recycler.color);
}

function bufferImpact(damage, kind) {
  if (!game.capacitorCharged || kind === 'boss') return damage;
  const tier = equippedTier('capacitor');
  if (!tier) return damage;
  const stopped = Math.min(damage, GEAR.capacitor.damage[tier - 1]);
  game.capacitorCharged = false;
  ripple(CENTER, 53, GEAR.capacitor.color);
  announce(`缓冲电容吸收 ${stopped} 点撞击伤害。`, 2.1);
  notes([370, 514], 'sine', .045);
  return damage - stopped;
}

function drawOuterGuides() {
  if (!game.stage.escorts && !game.stage.skirting) return;
  pen.save();
  for (const enemy of game.enemies) {
    if (enemy.dead) continue;
    const escort = activeEscort(enemy);
    if (escort) {
      pen.lineWidth = 2;
      pen.strokeStyle = '#ffbe686d';
      segment(pen, escort.x, escort.y, enemy.x, enemy.y);
      pen.lineWidth = 1;
      pen.strokeStyle = '#ffda9b';
      circle(pen, enemy.x, enemy.y, enemy.size + 4);
      pen.stroke();
    }
    if (enemy.skirtDirection && distance(CENTER, enemy) < SKIRT_RADIUS + 45) {
      const sweep = enemy.skirtRemaining ?? SKIRT_SWEEP;
      pen.strokeStyle = '#ffc58bba';
      pen.lineWidth = 2;
      pen.setLineDash([4, 5]);
      pen.beginPath();
      pen.arc(CENTER.x, CENTER.y, SKIRT_RADIUS, enemy.angle,
        enemy.angle + sweep * enemy.skirtDirection, enemy.skirtDirection < 0);
      pen.stroke();
      pen.setLineDash([]);
    }
  }
  pen.restore();
}

function drawOuterEnemyShape(enemy) {
  const size = enemy.size;
  if (enemy.kind === 'escort') {
    polygon(pen, [[size, 0], [size * .45, -size * .8], [-size * .65, -size],
      [-size * .43, 0], [-size * .65, size], [size * .45, size * .8]]);
  } else {
    pen.rotate(-enemy.cargoDirection * Math.PI / 2);
    polygon(pen, [[size * 1.28, 0], [size * .5, -size * .65], [-size * .9, -size * .65],
      [-size * 1.12, 0], [-size * .9, size * .65], [size * .5, size * .65]]);
  }
}

function drawMines() {
  pen.save();
  for (const mine of game.mines) {
    const armed = mine.age >= .4;
    pen.strokeStyle = armed ? '#ffc58b' : '#b99d80';
    pen.fillStyle = armed ? '#ffc58b44' : '#ffc58b20';
    pen.lineWidth = 1.3;
    circle(pen, mine.x, mine.y, armed ? 7 : 4 + mine.age * 7);
    pen.fill();
    pen.stroke();
    if (armed) {
      segment(pen, mine.x - 10, mine.y, mine.x - 4, mine.y);
      segment(pen, mine.x + 4, mine.y, mine.x + 10, mine.y);
    }
  }
  pen.restore();
}

const BREACHER_RANGE = 146;
const BREACHER_CHARGE = 1.9;
const INTERFERENCE_COLOR = '#8cebe1';

function onFinaleDefeat(enemy, orbit) {
  if (enemy.kind === 'splitter') {
    const radius = distance(CENTER, enemy);
    const angle = Math.atan2(enemy.y - CENTER.y, enemy.x - CENTER.x);
    for (const turn of [-.15, .15]) {
      const shard = addEnemy('dart', angle + turn, radius + 9);
      shard.maxHealth *= .48;
      shard.health = shard.maxHealth;
      shard.canDash = false;
      shard.size = 6;
    }
  }

  const tier = equippedTier('aftershock');
  if (!tier || enemy.kind === 'boss' || game.time < game.aftershockReadyAt) return;
  const radius = [43, 60, 75][tier - 1];
  const nearby = game.enemies.filter(target => !target.dead && distance(enemy, target) <= radius);
  if (!nearby.length) return;
  game.aftershockReadyAt = game.time + [2.15, 1.85, 1.45][tier - 1];
  const spec = GEAR.aftershock;
  ripple(enemy, radius, spec.color);
  notes([240, 130], 'triangle', .04);
  for (const target of nearby) {
    target.hitColor = spec.color;
    strike(target, spec.damage[tier - 1], orbit);
  }
}

function advanceInterference() {
  const field = game.stage.interference;
  if (!field || game.wave < field.from || game.wave >= game.stage.waves.length - 1 || game.respite !== null) {
    game.interference = null;
    return;
  }
  const warning = game.interference;
  if (!warning) {
    if (game.time < game.interferenceAt) return;
    game.interference = {orbit: game.orbit, until: game.time + field.warning};
    notes([405, 330], 'sine', .055);
    return;
  }
  if (game.time < warning.until) return;

  game.interference = null;
  game.interferenceAt = game.time + field.interval;
  const radius = ORBITS[warning.orbit];
  ripple(CENTER, radius + 8, INTERFERENCE_COLOR);
  const struck = Math.abs(game.radius - radius) < (ORBITS.outer - ORBITS.inner) / 2;
  if (!struck) {
    announce('已避开轨道干扰。', 1.4);
    return;
  }
  const duration = field.duration * [1, .55, .25, 0][equippedTier('coil')];
  if (duration > 0) {
    game.jammedUntil = game.time + duration;
    announce('轨道干扰命中，武器短暂停火。', 1.5);
    notes([198], 'triangle', .055);
  } else {
    announce('抗扰线圈已吸收干扰。', 1.7);
  }
}

function isChargingBreacher(enemy) {
  return enemy.kind === 'breacher' && !enemy.dead && !enemy.breachSpent && enemy.breachIn > 0;
}

function updateBreacher(enemy, dt) {
  if (enemy.breachSpent) return false;
  if (enemy.breachIn === undefined) {
    enemy.breachIn = BREACHER_CHARGE;
    ripple(enemy, 25, GEAR.spike.color);
    notes([265], 'sine', .045);
  }
  if (enemy.stop > 0) return true;
  enemy.breachIn -= dt * (enemy.slow > 0 ? .65 : 1);
  if (enemy.breachIn > 0) return true;

  enemy.breachSpent = true;
  const damage = game.wave >= 3 ? 13 : 10;
  game.hp = Math.max(0, game.hp - damage);
  game.coreFlash = .43;
  supportBeam(enemy, CENTER, '#ffa973', 'turret');
  ripple(CENTER, 42, '#ffa973');
  announce(`攻城炮命中 · 核心受损 ${damage}%`, 2);
  notes([145, 97], 'triangle', .08);
  if (game.hp === 0) endGame(false, '攻城炮击毁了核心');
  return true;
}

function fireStaggerSpike(item, origin) {
  const spec = GEAR.spike;
  const range = spec.range + (item.tier - 1) * 12;
  const charging = game.enemies.filter(isChargingBreacher);
  const target = closest(origin, range, charging) ?? closest(origin, range, game.enemies);
  if (!target) return;
  staggerTarget(item, origin, target, 1);
  if (item.tier === 3) {
    const second = closest(target, 105, charging.filter(enemy => enemy !== target));
    if (second) staggerTarget(item, target, second, .65);
  }
  recoverWeapon(item);
}

function staggerTarget(item, origin, target, scale) {
  const spec = GEAR.spike;
  if (isChargingBreacher(target)) {
    target.breachSpent = true;
    ripple(target, 29, spec.color);
    announce('已打断攻城炮蓄能。', 1.5);
  }
  supportBeam(origin, target, spec.color, 'intercept');
  target.hitColor = spec.color;
  strike(target, spec.damage[item.tier - 1] * scale);
}

function callSiegeReinforcement(boss) {
  const threshold = game.stage.breacherAtHealth;
  if (!threshold || !boss.summonedEscort || boss.siegeCalled || boss.health > boss.maxHealth * threshold) return false;
  boss.siegeCalled = true;
  const angle = Math.atan2(boss.y - CENTER.y, boss.x - CENTER.x) - .38;
  const radius = Math.min(153, Math.max(136, distance(CENTER, boss) + 24));
  const siege = addEnemy('breacher', angle, radius);
  boss.relayAt = Math.max(boss.relayAt, game.time + 3.35);
  ripple(siege, 36, GEAR.spike.color);
  announce('首领呼叫攻城炮舰，先打断它的蓄能。', 3.1);
  return true;
}

function chargeDynamo() {
  const tier = equippedTier('dynamo');
  if (!tier || game.innerTravel < FULL_TURN / 4 || game.innerTravel > FULL_TURN * .75) return;
  game.overdriveUntil = game.time + [1.6, 2.25, 3][tier - 1];
  for (const item of game.kit) {
    if (item?.readyIn > 0) item.readyIn /= 1.3;
  }
  ripple(port(game.radius, game.angle), 42, GEAR.dynamo.color);
  notes([420, 590, 720], 'sine', .04);
}

function drawFinaleGuides(time) {
  const warning = game.interference;
  if (warning) {
    pen.save();
    pen.strokeStyle = INTERFERENCE_COLOR;
    pen.globalAlpha = .52 + Math.sin(time * 10) * .20;
    pen.lineWidth = 6;
    pen.setLineDash([3, 8]);
    circle(pen, CENTER.x, CENTER.y, ORBITS[warning.orbit]);
    pen.stroke();
    pen.restore();
  }

  if (!game.stage.breacherAtHealth && !game.stage.waves[game.wave].breachersAt) return;
  for (const enemy of game.enemies) {
    if (!isChargingBreacher(enemy)) continue;
    const progress = 1 - enemy.breachIn / BREACHER_CHARGE;
    pen.save();
    pen.strokeStyle = GEAR.spike.color;
    pen.globalAlpha = .34 + progress * .54;
    pen.lineWidth = 1.3 + progress * 2.4;
    pen.setLineDash([4, 5]);
    segment(pen, enemy.x, enemy.y, CENTER.x, CENTER.y);
    pen.setLineDash([]);
    pen.beginPath();
    pen.arc(enemy.x, enemy.y, enemy.size + 6, START_ANGLE, START_ANGLE + FULL_TURN * Math.max(.05, progress));
    pen.stroke();
    pen.restore();
  }
}

function drawFinaleEnemyShape(enemy) {
  const size = enemy.size;
  if (enemy.kind === 'splitter') {
    polygon(pen, [[size, 0], [0, -size], [-size, -size * .68], [-size * .37, 0],
      [-size, size * .68], [0, size]]);
  } else {
    polygon(pen, [[size * 1.2, -size * .3], [size * .35, -size * .3], [0, -size], [-size, -size * .65],
      [-size, size * .65], [0, size], [size * .35, size * .3], [size * 1.2, size * .3]]);
  }
}

function progressStageIndex() {
  if (game.mode === 'paused') return game.stage.id - 1;
  const next = STAGES.findIndex((stage, index) => unlocked(index) && !profile.records[stage.id]?.clear);
  return next === -1 ? STAGES.length - 1 : next;
}

function syncProgress() {
  const clears = STAGES.filter(stage => profile.records[stage.id]?.clear).length;
  const progress = `${clears} / ${STAGES.length}`;
  const next = STAGES[progressStageIndex()];
  ui['home-progress'].textContent = progress;
  ui['home-meter'].setAttribute('aria-valuemax', String(STAGES.length));
  ui['home-meter'].setAttribute('aria-valuenow', String(clears));
  ui['home-fill'].style.width = (clears / STAGES.length * 100) + '%';
  ui['home-current'].textContent = clears === STAGES.length
    ? '全部战区已守住' : `下一目标 · 第 ${next.id} 关 ${next.name}`;
  ui['profile-clears'].textContent = progress;
  ui['profile-runs'].textContent = profile.runs;
  ui['profile-kills'].textContent = profile.kills;
  if (screen === 'profile') ui.callsign.value = profile.callsign;
}

function stageStatus(index) {
  const stage = STAGES[index];
  if (game.mode === 'paused' && game.stage.id === stage.id) return '对局暂停';
  if (profile.records[stage.id]?.clear) return '已通关';
  return unlocked(index) ? '可出击' : '未解锁';
}

function renderLevelPage() {
  selectedStageIndex ??= progressStageIndex();
  const chapter = Math.floor(selectedStageIndex / STAGES_PER_CHAPTER);
  const first = chapter * STAGES_PER_CHAPTER;
  const stages = STAGES.slice(first, first + STAGES_PER_CHAPTER);
  const startId = stages[0].id;
  const endId = stages[stages.length - 1].id;
  const clears = stages.filter(stage => profile.records[stage.id]?.clear).length;
  const chapters = Math.ceil(STAGES.length / STAGES_PER_CHAPTER);

  ui['chapter-prev'].disabled = first === 0;
  ui['chapter-next'].disabled = first + stages.length >= STAGES.length;
  ui['chapter-name'].textContent = CHAPTER_NAMES[chapter] ?? `第 ${chapter + 1} 章`;
  ui['chapter-range'].textContent = `第 ${startId}–${endId} 关 · ${clears}/${stages.length} 通关 · ${chapter + 1}/${chapters} 章`;
  ui['level-number'].placeholder = `1–${STAGES[STAGES.length - 1].id}`;
  ui['level-support'].textContent = currentSupport()
    ? `支援装备 · ${GEAR[support].name}  ›` : '选择支援装备  ›';

  const tiles = stages.map((stage, offset) => {
    const index = first + offset;
    const button = document.createElement('button');
    const number = document.createElement('b');
    const label = document.createElement('span');
    const status = stageStatus(index);
    button.type = 'button';
    button.className = 'stage-tile';
    button.dataset.index = index;
    button.dataset.state = unlocked(index) ? (profile.records[stage.id]?.clear ? 'clear' : 'open') : 'locked';
    button.setAttribute('aria-label', `第 ${stage.id} 关 ${stage.name}，${status}`);
    button.title = stage.name;
    number.textContent = String(stage.id).padStart(2, '0');
    label.textContent = status;
    button.append(number, label);
    button.addEventListener('click', () => {
      selectedStageIndex = index;
      clearLevelError();
      renderStageDetail();
    });
    return button;
  });
  ui['stage-grid'].replaceChildren(...tiles);
  renderStageDetail();
}

function renderStageDetail() {
  const stage = STAGES[selectedStageIndex];
  const open = unlocked(selectedStageIndex);
  const record = profile.records[stage.id];
  const detail = ui['stage-detail'];
  detail.dataset.stage = stage.id;
  detail.classList.toggle('locked', !open);
  detail.classList.toggle('cleared', Boolean(record?.clear));
  ui['stage-index'].textContent = `第 ${stage.id} 关`;
  ui['stage-state'].textContent = stageStatus(selectedStageIndex);
  ui['stage-name'].textContent = stage.name;
  ui['stage-description'].textContent = stage.detail;
  ui['stage-score'].textContent = open ?
    (record ? `最佳 · ${stageRecord(record)}` : `${stage.waves.length} 波敌潮`) :
    `通关第 ${STAGES[selectedStageIndex - 1].id} 关后解锁`;
  ui['stage-reward'].hidden = !stage.reward;
  ui['stage-reward'].textContent = stage.reward ?
    `${record?.clear ? '已解锁' : '通关解锁'} · ${GEAR[stage.reward].name}  ›` : '';
  const launch = ui['stage-launch'];
  launch.disabled = !open;
  const parked = game.mode === 'paused' && game.stage.id === stage.id;
  launch.textContent = parked ? '继续防守' : open ? '开始出击' : '未解锁';
  launch.setAttribute('aria-label', `${stage.name} · ${launch.textContent}`);
  for (const tile of ui['stage-grid'].children) {
    tile.setAttribute('aria-pressed', String(Number(tile.dataset.index) === selectedStageIndex));
  }
}

function clearLevelError() {
  ui['level-jump-error'].textContent = '';
  ui['level-jump-error'].hidden = true;
  ui['level-number'].removeAttribute('aria-invalid');
}

function moveToStage(index, focus = false) {
  if (!STAGES[index]) return;
  selectedStageIndex = index;
  clearLevelError();
  if (screen !== 'levels') {
    showScreen('levels');
    return;
  }
  renderLevelPage();
  if (focus) ui['stage-detail'].focus();
}

function currentSupport() {
  return gearUnlocked(support) ? support : '';
}

function catalogOwned(kind) {
  return BASE_GEAR.includes(kind) || gearUnlocked(kind);
}

function renderEquipmentPage() {
  const query = ui['equipment-search'].value.trim().toLowerCase();
  const filter = ui['equipment-filter'].value;
  const owned = CATALOG_KINDS.filter(catalogOwned).length;
  const chosen = currentSupport();
  ui['equipment-progress'].textContent = `已解锁 ${owned} / ${CATALOG_KINDS.length}`;
  ui['catalog-current'].textContent = chosen
    ? `当前支援 · ${GEAR[chosen].name}。新开一局时加入打捞池。`
    : '可选一件已解锁的支援装备，加入新开对局的打捞池。';

  const matches = CATALOG_KINDS.filter(kind => {
    const owned = catalogOwned(kind);
    const statusMatches = filter === 'owned' ? owned : filter === 'locked' ? !owned : true;
    return statusMatches && GEAR[kind].name.toLowerCase().includes(query);
  });
  const total = Math.ceil(matches.length / EQUIPMENT_PER_PAGE);
  catalogPage = Math.max(0, Math.min(catalogPage, total - 1));
  const pageItems = matches.slice(catalogPage * EQUIPMENT_PER_PAGE, (catalogPage + 1) * EQUIPMENT_PER_PAGE);
  if (!pageItems.includes(catalogKind)) catalogKind = pageItems[0];

  const tiles = pageItems.map(kind => {
    const button = document.createElement('button');
    const icon = document.createElement('span');
    const info = document.createElement('span');
    const title = document.createElement('strong');
    const state = document.createElement('span');
    button.type = 'button';
    button.className = 'equipment-tile';
    button.dataset.kind = kind;
    button.classList.toggle('locked', !catalogOwned(kind));
    icon.className = 'glyph ' + kind;
    icon.setAttribute('aria-hidden', 'true');
    info.className = 'equipment-tile-copy';
    title.textContent = GEAR[kind].name;
    state.textContent = chosen === kind ? '支援中' : catalogOwned(kind) ? '已解锁' : '未解锁';
    info.append(title, state);
    button.append(icon, info);
    button.addEventListener('click', () => {
      catalogKind = kind;
      renderCatalogDetail();
    });
    return button;
  });

  ui['equipment-list'].replaceChildren(...tiles);
  ui['equipment-empty'].hidden = matches.length > 0;
  ui['equipment-pager'].hidden = total <= 1;
  ui['equipment-prev'].disabled = catalogPage === 0;
  ui['equipment-next'].disabled = catalogPage + 1 >= total;
  ui['equipment-page'].textContent = `第 ${catalogPage + 1} / ${total} 页`;
  renderCatalogDetail();
}

function renderCatalogDetail() {
  const detail = ui['catalog-detail'];
  detail.hidden = !catalogKind;
  if (!catalogKind) return;
  const gear = GEAR[catalogKind];
  const source = GEAR_SOURCES.get(catalogKind);
  const owned = catalogOwned(catalogKind);
  const selected = currentSupport() === catalogKind;
  detail.dataset.kind = catalogKind;
  ui['catalog-glyph'].className = 'glyph ' + catalogKind;
  ui['catalog-name'].textContent = gear.name;
  ui['catalog-source'].textContent = source ? `第 ${source.id} 关 · ${source.name}` : '基础装备 · 常规打捞';
  ui['catalog-state'].textContent = selected ? '支援中' : owned ? '已解锁' : '未解锁';
  ui['catalog-state'].classList.toggle('owned', owned);
  ui['catalog-tiers'].replaceChildren(...gear.descriptions.map((description, index) => {
    const row = document.createElement('div');
    const tier = document.createElement('dt');
    const text = document.createElement('dd');
    tier.textContent = TIERS[index];
    text.textContent = description;
    row.append(tier, text);
    return row;
  }));
  ui['catalog-source-link'].hidden = !source;
  ui['catalog-support'].hidden = !source;
  ui['catalog-support'].disabled = !owned;
  ui['catalog-support'].textContent = selected ? '移除支援' : '设为支援';
  if (source && !owned) ui['catalog-support'].textContent = '首通后可设为支援';
  for (const tile of ui['equipment-list'].children) {
    tile.setAttribute('aria-pressed', String(tile.dataset.kind === catalogKind));
  }
}

function openCatalogItem(kind) {
  ui['equipment-search'].value = '';
  ui['equipment-filter'].value = 'all';
  catalogKind = CATALOG_KINDS.includes(kind) ? kind : BASE_GEAR[0];
  catalogPage = Math.floor(CATALOG_KINDS.indexOf(catalogKind) / EQUIPMENT_PER_PAGE);
  showScreen('equipment');
}

function bindBrowseControls() {
  ui['home-play'].addEventListener('click', () => moveToStage(progressStageIndex()));
  ui['level-resume'].addEventListener('click', () => moveToStage(progressStageIndex(), true));
  ui['chapter-prev'].addEventListener('click', () => {
    moveToStage((Math.floor(selectedStageIndex / STAGES_PER_CHAPTER) - 1) * STAGES_PER_CHAPTER);
  });
  ui['chapter-next'].addEventListener('click', () => {
    moveToStage((Math.floor(selectedStageIndex / STAGES_PER_CHAPTER) + 1) * STAGES_PER_CHAPTER);
  });
  ui['level-number'].addEventListener('input', clearLevelError);
  ui['level-jump'].addEventListener('submit', event => {
    event.preventDefault();
    const raw = ui['level-number'].value.trim().normalize('NFKC');
    const index = /^\d+$/.test(raw) ? STAGES.findIndex(stage => stage.id === Number(raw)) : -1;
    if (index >= 0) {
      ui['level-number'].value = '';
      moveToStage(index, true);
      return;
    }
    ui['level-jump-error'].textContent = `请输入 1–${STAGES[STAGES.length - 1].id} 之间的关卡号。`;
    ui['level-jump-error'].hidden = false;
    ui['level-number'].setAttribute('aria-invalid', 'true');
  });
  ui['stage-launch'].addEventListener('click', () => launchStage(selectedStageIndex));
  ui['stage-reward'].addEventListener('click', () => openCatalogItem(STAGES[selectedStageIndex].reward));
  ui['level-support'].addEventListener('click', () => {
    openCatalogItem(currentSupport() || CATALOG_KINDS.find(gearUnlocked) || GEAR_SOURCES.keys().next().value);
  });

  const resetCatalog = () => {
    catalogPage = 0;
    renderEquipmentPage();
  };
  ui['equipment-search'].addEventListener('input', resetCatalog);
  ui['equipment-filter'].addEventListener('change', resetCatalog);
  ui['equipment-prev'].addEventListener('click', () => {
    catalogPage--;
    renderEquipmentPage();
  });
  ui['equipment-next'].addEventListener('click', () => {
    catalogPage++;
    renderEquipmentPage();
  });
  ui['catalog-source-link'].addEventListener('click', () => {
    const stage = GEAR_SOURCES.get(catalogKind);
    if (stage) moveToStage(STAGES.indexOf(stage));
  });
  ui['catalog-support'].addEventListener('click', () => {
    if (!gearUnlocked(catalogKind)) return;
    support = currentSupport() === catalogKind ? '' : catalogKind;
    writePreference('support', support);
    renderEquipmentPage();
  });
}

</script>
</body>
</html>
